<!DOCTYPE html>
<html lang="ru" class="theme-dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nerve</title>
  <meta name="description" content="Local-first notes without folders — untouched thoughts naturally fade into Archive." />
  <meta id="themeColorMeta" name="theme-color" content="#0A0B0D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nerve" />
  <link rel="manifest" href="./manifest.json" />
  <link id="dynamicFavicon" rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link id="appleTouchIcon" rel="apple-touch-icon" href="./icon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================
       ДИЗАЙН-ТОКЕНЫ И 4 ТЕМЫ NERVE
       ========================================== */
    :root {
      color-scheme: dark;
      --bg: #0A0B0D;
      --surface: #111215;
      --surface-elevated: #16181D;
      --surface-hover: rgba(255, 255, 255, 0.045);
      --border-subtle: rgba(255, 255, 255, 0.09);
      --border-faint: rgba(255, 255, 255, 0.055);
      --hot: #F2F1EC;
      --ink-84: rgba(242, 241, 236, 0.84);
      --ink-62: rgba(242, 241, 236, 0.62);
      --ink-40: rgba(242, 241, 236, 0.42);
      --ink-32: rgba(242, 241, 236, 0.30);
      --ink-18: rgba(242, 241, 236, 0.18);
      --chip-bg: rgba(255, 255, 255, 0.08);
      --rail: rgba(242, 241, 236, 0.14);
      --danger: #E05A5A;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html.theme-light {
      color-scheme: light;
      --bg: #F4F3EE;
      --surface: #ECEAE2;
      --surface-elevated: #F9F8F4;
      --surface-hover: rgba(22, 23, 26, 0.045);
      --border-subtle: rgba(22, 23, 26, 0.11);
      --border-faint: rgba(22, 23, 26, 0.065);
      --hot: #16171A;
      --ink-84: rgba(22, 23, 26, 0.84);
      --ink-62: rgba(22, 23, 26, 0.64);
      --ink-40: rgba(22, 23, 26, 0.46);
      --ink-32: rgba(22, 23, 26, 0.34);
      --ink-18: rgba(22, 23, 26, 0.16);
      --chip-bg: rgba(22, 23, 26, 0.075);
      --rail: rgba(22, 23, 26, 0.14);
      --danger: #C93B3B;
    }

    html.theme-sepia {
      color-scheme: light;
      --bg: #EBE3D2;
      --surface: #E2D8C3;
      --surface-elevated: #F2EBDC;
      --surface-hover: rgba(42, 33, 27, 0.05);
      --border-subtle: rgba(42, 33, 27, 0.12);
      --border-faint: rgba(42, 33, 27, 0.07);
      --hot: #2A211B;
      --ink-84: rgba(42, 33, 27, 0.85);
      --ink-62: rgba(42, 33, 27, 0.64);
      --ink-40: rgba(42, 33, 27, 0.48);
      --ink-32: rgba(42, 33, 27, 0.35);
      --ink-18: rgba(42, 33, 27, 0.17);
      --chip-bg: rgba(42, 33, 27, 0.08);
      --rail: rgba(42, 33, 27, 0.16);
      --danger: #B83A32;
    }

    html.theme-slate {
      color-scheme: dark;
      --bg: #12151A;
      --surface: #181C23;
      --surface-elevated: #1E242E;
      --surface-hover: rgba(230, 234, 240, 0.05);
      --border-subtle: rgba(230, 234, 240, 0.10);
      --border-faint: rgba(230, 234, 240, 0.06);
      --hot: #E6EAF0;
      --ink-84: rgba(230, 234, 240, 0.85);
      --ink-62: rgba(230, 234, 240, 0.63);
      --ink-40: rgba(230, 234, 240, 0.44);
      --ink-32: rgba(230, 234, 240, 0.31);
      --ink-18: rgba(230, 234, 240, 0.17);
      --chip-bg: rgba(230, 234, 240, 0.09);
      --rail: rgba(230, 234, 240, 0.15);
      --danger: #E26363;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg);
      color: var(--hot);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      transition: background-color 0.22s ease, color 0.22s ease;
    }

    /* Утилиты для тем */
    .t-bg { background-color: var(--bg); }
    .t-surface { background-color: var(--surface); }
    .t-elevated { background-color: var(--surface-elevated); }
    .t-border { border-color: var(--border-subtle); }
    .t-border-faint { border-color: var(--border-faint); }
    .t-hot { color: var(--hot); }
    .t-ink-84 { color: var(--ink-84); }
    .t-ink-62 { color: var(--ink-62); }
    .t-ink-40 { color: var(--ink-40); }
    .t-ink-32 { color: var(--ink-32); }

    /* Тихий скроллбар */
    .quiet-scroll {
      scrollbar-width: thin;
      scrollbar-color: var(--border-subtle) transparent;
    }
    .quiet-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .quiet-scroll::-webkit-scrollbar-track { background: transparent; }
    .quiet-scroll::-webkit-scrollbar-thumb {
      background-color: var(--border-subtle);
      border-radius: 9999px;
    }

    /* Кнопки шапки и действий */
    .header-ghost-btn {
      padding: 6px 11px;
      border-radius: 9999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-62);
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.16s ease, background-color 0.16s ease, border-color 0.16s ease;
    }
    .header-ghost-btn:hover {
      color: var(--hot);
      background-color: var(--surface-hover);
    }

    .header-pill-btn {
      padding: 7px 14px;
      border-radius: 9999px;
      border: 1px solid var(--border-subtle);
      background-color: var(--surface);
      color: var(--hot);
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
    }
    .header-pill-btn:hover {
      background-color: var(--surface-elevated);
      border-color: var(--ink-32);
    }
    .header-pill-btn:active { transform: scale(0.98); }

    .primary-btn {
      padding: 8px 16px;
      border-radius: 9999px;
      border: 0;
      background-color: var(--hot);
      color: var(--bg);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.16s ease, transform 0.12s ease;
    }
    .primary-btn:hover { opacity: 0.9; }
    .primary-btn:active { transform: scale(0.98); }

    .seg-btn {
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-faint);
      background: transparent;
      color: var(--ink-62);
      font-size: 12.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.16s ease;
    }
    .seg-btn:hover {
      color: var(--hot);
      background-color: var(--surface-hover);
    }
    .seg-btn.is-active {
      color: var(--hot);
      background-color: var(--chip-bg);
      border-color: var(--border-subtle);
      font-weight: 500;
    }

    /* ==========================================
       ВЕРТИКАЛЬНАЯ НИТЬ (ЛЕВАЯ КОЛОНКА)
       ========================================== */
    .thread-col {
      width: 316px;
      min-width: 316px;
      border-right: 1px solid var(--border-faint);
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .thread-list {
      position: relative;
      padding: 16px 12px 28px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .thread-node {
      position: relative;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 13px;
      padding: 10px 12px 10px 30px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: background-color 0.16s ease, border-color 0.16s ease, opacity 0.2s ease;
    }
    .thread-node::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 0;
      bottom: 0;
      width: 1px;
      background-color: var(--rail);
    }
    .thread-node:first-child::before { top: 18px; }
    .thread-node:last-child::before { bottom: calc(100% - 18px); }

    .thread-node:hover {
      background-color: var(--surface-hover);
    }
    .thread-node.is-selected {
      background-color: var(--surface);
      border-color: var(--border-faint);
    }

    .node-dot {
      position: absolute;
      left: 10px;
      top: 15px;
      width: 9px;
      height: 9px;
      border-radius: 9999px;
      background-color: var(--hot);
      border: 1.5px solid var(--bg);
      transition: transform 0.16s ease, background-color 0.2s ease, opacity 0.2s ease;
      z-index: 2;
    }
    .thread-node.is-selected .node-dot {
      transform: scale(1.18);
    }
    .thread-node.temp-cooling .node-dot {
      background-color: var(--ink-62);
    }
    .thread-node.temp-cold .node-dot {
      background-color: var(--bg);
      border: 1.5px solid var(--ink-40);
    }
    .thread-node.temp-cooling .node-title { color: var(--ink-84); }
    .thread-node.temp-cold .node-title { color: var(--ink-62); }

    .node-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--hot);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }
    .node-meta {
      font-size: 11.5px;
      color: var(--ink-40);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rest-node {
      margin-top: 8px;
    }
    .rest-node .node-dot {
      background-color: var(--bg);
      border: 1.5px dashed var(--ink-40);
    }

    /* ==========================================
       ЛИСТ ЧТЕНИЯ И РЕДАКТИРОВАНИЯ
       ========================================== */
    .reading-col {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
      position: relative;
    }

    .note-toolbar-btn {
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-62);
      font-size: 12.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .note-toolbar-btn:hover {
      background-color: var(--surface-hover);
      color: var(--hot);
    }
    .note-toolbar-btn.is-active {
      background-color: var(--chip-bg);
      color: var(--hot);
      border-color: var(--border-faint);
    }

    /* Выпадающее меню действий заметки (···) и ПКМ */
    .note-menu-wrap { position: relative; }
    .note-menu-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 204px;
      background-color: var(--surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.38);
      z-index: 60;
      display: none;
      flex-direction: column;
      gap: 2px;
    }
    .note-menu-dropdown.is-open {
      display: flex;
      animation: cardPop 0.14s var(--ease) both;
    }
    .note-menu-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink-84);
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: left;
      transition: background-color 0.14s ease, color 0.14s ease;
    }
    .note-menu-item:hover {
      background-color: var(--surface-hover);
      color: var(--hot);
    }
    .note-menu-item.is-active {
      color: var(--hot);
      background-color: var(--chip-bg);
    }
    .note-menu-item.is-danger {
      color: var(--danger);
    }
    .note-menu-item.is-danger:hover {
      background-color: rgba(224, 90, 90, 0.12);
    }
    .note-menu-divider {
      height: 1px;
      background-color: var(--border-faint);
      margin: 4px 6px;
    }

    /* Контекстное меню по ПКМ на заметке в нити */
    .ctx-menu {
      position: fixed;
      min-width: 204px;
      background-color: var(--surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.42);
      z-index: 90;
      display: none;
      flex-direction: column;
      gap: 2px;
    }
    .ctx-menu.is-open {
      display: flex;
      animation: cardPop 0.14s var(--ease) both;
    }

    /* ==========================================
       MARKDOWN-ТИПОГРАФИКА И ВСТРОЕННЫЕ ФОТО
       ========================================== */
    .md-body {
      font-size: 15.5px;
      line-height: 1.72;
      color: var(--ink-84);
      word-break: break-word;
    }
    .md-body::after {
      content: '';
      display: table;
      clear: both;
    }
    .md-body h1 {
      font-size: 1.45em;
      font-weight: 500;
      color: var(--hot);
      margin: 1.3em 0 0.5em;
      letter-spacing: -0.015em;
      line-height: 1.3;
      clear: both;
    }
    .md-body h2 {
      font-size: 1.24em;
      font-weight: 500;
      color: var(--hot);
      margin: 1.25em 0 0.45em;
      letter-spacing: -0.01em;
      line-height: 1.35;
      clear: both;
    }
    .md-body h3, .md-body h4 {
      font-size: 1.06em;
      font-weight: 500;
      color: var(--hot);
      margin: 1.1em 0 0.4em;
      line-height: 1.4;
      clear: both;
    }
    .md-body p {
      margin: 0 0 0.9em;
    }
    .md-body p:last-child { margin-bottom: 0; }
    .md-body strong {
      color: var(--hot);
      font-weight: 600;
    }
    .md-body em { font-style: italic; }
    .md-body del { opacity: 0.55; }
    .md-body a {
      color: var(--hot);
      text-decoration: underline;
      text-decoration-color: var(--ink-32);
      text-underline-offset: 3px;
    }
    .md-body a:hover { text-decoration-color: var(--hot); }
    .md-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88em;
      padding: 2px 6px;
      border-radius: 6px;
      background-color: var(--surface);
      border: 1px solid var(--border-faint);
      color: var(--hot);
    }
    .md-body pre {
      margin: 1em 0;
      padding: 14px 16px;
      border-radius: 14px;
      background-color: var(--surface);
      border: 1px solid var(--border-faint);
      overflow-x: auto;
      clear: both;
    }
    .md-body pre code {
      padding: 0;
      border: 0;
      background: transparent;
      font-size: 13px;
      line-height: 1.6;
    }
    .md-body blockquote {
      margin: 1em 0;
      padding: 4px 0 4px 16px;
      border-left: 2px solid var(--ink-32);
      color: var(--ink-62);
    }
    .md-body hr {
      border: 0;
      border-top: 1px solid var(--border-faint);
      margin: 1.5em 0;
      clear: both;
    }
    .md-body ul, .md-body ol {
      margin: 0.4em 0 1em;
      padding-left: 1.35em;
    }
    .md-body li { margin: 0.32em 0; }
    .md-body ul.md-checklist {
      list-style: none;
      padding-left: 0;
    }
    .md-check-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0.4em 0;
    }
    .md-check-box {
      width: 18px;
      height: 18px;
      margin-top: 4px;
      border-radius: 6px;
      border: 1.5px solid var(--ink-32);
      background: transparent;
      color: var(--bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .md-check-box:hover { border-color: var(--hot); }
    .md-check-box.is-checked {
      background-color: var(--hot);
      border-color: var(--hot);
    }
    .md-check-text.is-checked {
      text-decoration: line-through;
      color: var(--ink-40);
    }
    .cite-badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      line-height: 1;
      padding: 2px 5px;
      margin: 0 2px;
      border-radius: 6px;
      background-color: var(--chip-bg);
      color: var(--ink-62);
      vertical-align: 1px;
    }

    /* Встроенные изображения по месту в тексте + обтекание */
    .md-inline-figure {
      margin: 1.15em 0;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-faint);
      background-color: var(--surface);
      clear: both;
    }
    .md-inline-figure img {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }
    .md-inline-figure.align-left {
      float: left;
      width: 42%;
      max-width: 280px;
      margin: 0.25em 1.25em 0.9em 0;
      clear: left;
    }
    .md-inline-figure.align-right {
      float: right;
      width: 42%;
      max-width: 280px;
      margin: 0.25em 0 0.9em 1.25em;
      clear: right;
    }
    .md-inline-figure.align-left img,
    .md-inline-figure.align-right img {
      max-height: 300px;
    }
    @media (max-width: 520px) {
      .md-inline-figure.align-left,
      .md-inline-figure.align-right {
        float: none;
        width: 100%;
        max-width: none;
        margin: 1em 0;
        clear: both;
      }
    }

    /* Компактная панель управления прямо на фото */
    .img-toolbar {
      position: absolute;
      top: 10px;
      right: 10px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 9999px;
      background-color: rgba(10, 11, 13, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity 0.16s ease;
      z-index: 4;
    }
    .md-inline-figure:hover .img-toolbar,
    .note-gallery-card:hover .img-toolbar,
    .img-toolbar:focus-within {
      opacity: 1;
    }
    @media (hover: none) {
      .img-toolbar { opacity: 0.92; }
    }
    .img-tool-btn {
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      border: 0;
      background: transparent;
      color: rgba(242, 241, 236, 0.8);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background-color 0.14s ease, color 0.14s ease;
    }
    .img-tool-btn:hover {
      background-color: rgba(255, 255, 255, 0.18);
      color: #FFFFFF;
    }
    .img-tool-btn.is-active {
      background-color: rgba(255, 255, 255, 0.26);
      color: #FFFFFF;
    }
    .img-tool-btn.is-danger:hover {
      background-color: rgba(205, 55, 55, 0.88);
      color: #FFFFFF;
    }
    .img-tool-sep {
      width: 1px;
      height: 14px;
      background-color: rgba(255, 255, 255, 0.16);
      margin: 0 2px;
    }

    /* Редактор текста */
    .edit-title-input {
      width: 100%;
      background: transparent;
      border: 0;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--hot);
      outline: none;
      margin-bottom: 14px;
      line-height: 1.25;
    }
    .edit-title-input::placeholder { color: var(--ink-32); }

    .edit-body-input {
      width: 100%;
      min-height: 280px;
      background: transparent;
      border: 0;
      font-family: inherit;
      font-size: 15.5px;
      line-height: 1.72;
      color: var(--ink-84);
      outline: none;
      resize: none;
      overflow: hidden;
    }
    .edit-body-input::placeholder { color: var(--ink-32); }

    /* ==========================================
       МОДАЛКИ, ТОСТ И ФОКУС-РЕЖИМ
       ========================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.56);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 80;
    }
    .modal-backdrop.is-open { display: flex; }

    .modal-card {
      width: 100%;
      background-color: var(--surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      animation: cardPop 0.18s var(--ease) both;
    }

    @keyframes cardPop {
      from { opacity: 0; transform: translateY(6px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .toast-pill {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background-color: var(--surface-elevated);
      color: var(--hot);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 8px 16px;
      font-size: 12.5px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.22s var(--ease);
      z-index: 110;
      white-space: nowrap;
    }
    .toast-pill.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Фокус-режим скрывает шапку и левую нить */
    body.focus-mode #appHeader,
    body.focus-mode #threadCol {
      display: none !important;
    }

    /* ==========================================
       МОБИЛЬНАЯ АДАПТИВНОСТЬ (НИТЬ <-> ЗАМЕТКА)
       ========================================== */
    @media (max-width: 767px) {
      .thread-col {
        width: 100%;
        min-width: 100%;
        border-right: 0;
      }
      .reading-col {
        display: none;
      }
      body.mobile-reading-open .thread-col {
        display: none;
      }
      body.mobile-reading-open .reading-col {
        display: flex;
      }
    }
  </style>

      function openDB() {
        return new Promise((resolve, reject) => {
          if (!('indexedDB' in window)) {
            reject(new Error('No IndexedDB'));
            return;
          }
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(DB_STORE)) {
              db.createObjectStore(DB_STORE);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbGet(key) {
        try {
          const db = await openDB();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, 'readonly');
            const req = tx.objectStore(DB_STORE).get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
        } catch (err) {
          return null;
        }
      }

      async function idbSet(key, val) {
        try {
          const db = await openDB();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, 'readwrite');
            tx.objectStore(DB_STORE).put(val, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => reject(tx.error);
          });
        } catch (err) {
          return false;
        }
      }

      function saveState() {
        idbSet('state', state);
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(state));
        } catch (err) {
          // Если много фото и localStorage переполнен, IndexedDB всё равно сохранил состояние
        }
        updateSavedStatusLabel();
      }

      async function loadState() {
        let loaded = await idbGet('state');
        if (!loaded) {
          try {
            const raw = localStorage.getItem(LS_KEY);
            if (raw) loaded = JSON.parse(raw);
          } catch (err) {}
        }

        if (loaded && typeof loaded === 'object') {
          state.theme = ['dark', 'light', 'sepia', 'slate'].includes(loaded.theme) ? loaded.theme : 'dark';
          state.lang = I18N[loaded.lang] ? loaded.lang : 'ru';
          state.coolingDays = Math.max(1, Math.min(365, Number(loaded.coolingDays) || 30));
          state.notes = Array.isArray(loaded.notes) ? loaded.notes.map(normalizeNote) : [];
        } else {
          const navLang = (navigator.language || 'ru').slice(0, 2).toLowerCase();
          state.lang = I18N[navLang] ? navLang : 'ru';
          state.notes = createStarterNotes(state.lang);
          saveState();
        }
      }

      function normalizeNote(n) {
        const now = Date.now();
        return {
          id: String(n.id || ('n_' + now + '_' + Math.random().toString(36).slice(2, 7))),
          title: typeof n.title === 'string' ? n.title : '',
          body: typeof n.body === 'string' ? n.body : '',
          createdAt: Number(n.createdAt) || now,
          lastHeatedAt: Number(n.lastHeatedAt) || Number(n.createdAt) || now,
          isPinned: Boolean(n.isPinned),
          isRested: Boolean(n.isRested),
          images: Array.isArray(n.images) ? n.images.filter(x => typeof x === 'string') : []
        };
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.remove('is-visible');
        }, 2400);
      }

      function autoResizeTextarea(el) {
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = Math.max(240, el.scrollHeight) + 'px';
      }

      function copyTextToClipboard(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try {
          ok = document.execCommand('copy');
        } catch (e) {}
        document.body.removeChild(ta);
        if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
      }

      function getDaysInactive(note) {
        return Math.max(0, Math.floor((Date.now() - (note.lastHeatedAt || note.createdAt)) / DAY_MS));
      }

      function isNoteArchived(note) {
        if (note.isRested) return true;
        if (note.isPinned) return false;
        return getDaysInactive(note) >= state.coolingDays;
      }

      function getNoteTempClass(note) {
        if (note.isPinned) return 'temp-hot';
        const ratio = getDaysInactive(note) / Math.max(1, state.coolingDays);
        if (ratio >= 0.72) return 'temp-cold';
        if (ratio >= 0.35) return 'temp-cooling';
        return 'temp-hot';
      }

      function getNoteStateLabel(note) {
        if (isNoteArchived(note)) return t('stateRested');
        if (note.isPinned) return t('statePinned');
        const days = getDaysInactive(note);
        if (days === 0) return t('today');
        return t('daysAgo', { n: days });
      }

      function deriveTitle(note) {
        const cleanTitle = (note.title || '').trim();
        if (cleanTitle) return cleanTitle;
        const firstLine = String(note.body || '')
          .split('\n')
          .map(l => l.replace(/^#+\s*/, '').replace(/^[-*]\s+(\[[ xX]\]\s+)?/, '').trim())
          .find(Boolean);
        return firstLine ? firstLine.slice(0, 64) : t('untitled');
      }

      function getPartitionedNotes() {
        const active = [];
        const archived = [];
        state.notes.forEach(n => {
          if (isNoteArchived(n)) archived.push(n);
          else active.push(n);
        });
        active.sort((a, b) => {
          if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
          return (b.lastHeatedAt || 0) - (a.lastHeatedAt || 0);
        });
        archived.sort((a, b) => (b.lastHeatedAt || 0) - (a.lastHeatedAt || 0));
        return { active, archived };
      }

      function updateAppleTouchIcon(bgHex, fgHex) {
        if (!appleTouchIcon) return;
        try {
          const c = document.createElement('canvas');
          c.width = 180;
          c.height = 180;
          const ctx = c.getContext('2d');
          ctx.fillStyle = bgHex;
          ctx.fillRect(0, 0, 180, 180);

          const p1 = 180 * 0.34;
          const p2 = 180 * 0.66;
          ctx.strokeStyle = fgHex;
          ctx.globalAlpha = 0.44;
          ctx.lineWidth = 11;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(p1, p1);
          ctx.lineTo(p2, p2);
          ctx.stroke();

          ctx.globalAlpha = 1;
          ctx.fillStyle = fgHex;
          ctx.beginPath();
          ctx.arc(p1, p1, 22, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = bgHex;
          ctx.beginPath();
          ctx.arc(p2, p2, 19, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = fgHex;
          ctx.globalAlpha = 0.78;
          ctx.lineWidth = 9.5;
          ctx.beginPath();
          ctx.arc(p2, p2, 19, 0, Math.PI * 2);
          ctx.stroke();

          appleTouchIcon.href = c.toDataURL('image/png');
        } catch (err) {}
      }

      const INLINE_IMG_TOKEN_RE = /^!\[([^\]]*)\]\(img:(\d+)(?:\|(left|right|full))?\)$/;

      function getReferencedImageIndices(body) {
        const used = new Set();
        const lines = String(body || '').replace(/\r\n/g, '\n').split('\n');
        lines.forEach(line => {
          const m = line.trim().match(INLINE_IMG_TOKEN_RE);
          if (m) {
            const idx = Number(m[2]) - 1;
            if (idx >= 0) used.add(idx);
          }
        });
        return used;
      }

      function compressImageFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('read error'));
          reader.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error('decode error'));
            img.onload = () => {
              const maxW = 1600;
              let w = img.width;
              let h = img.height;
              if (w > maxW) {
                h = Math.round(h * (maxW / w));
                w = maxW;
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', 0.84));
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

      function insertTextAtCursor(textarea, snippet, fallbackSelection = null) {
        if (!textarea) return false;
        let start = typeof textarea.selectionStart === 'number' ? textarea.selectionStart : textarea.value.length;
        let end = typeof textarea.selectionEnd === 'number' ? textarea.selectionEnd : textarea.value.length;
        if (fallbackSelection && document.activeElement !== textarea) {
          start = Math.min(textarea.value.length, Math.max(0, fallbackSelection.start));
          end = Math.min(textarea.value.length, Math.max(start, fallbackSelection.end));
        }
        const before = textarea.value.slice(0, start);
        const after = textarea.value.slice(end);
        const needLeadingBreak = before.length > 0 && !before.endsWith('\n\n')
          ? (before.endsWith('\n') ? '\n' : '\n\n')
          : '';
        const needTrailingBreak = after.length > 0 && !after.startsWith('\n\n')
          ? (after.startsWith('\n') ? '\n' : '\n\n')
          : '\n';
        const inserted = needLeadingBreak + snippet + needTrailingBreak;
        textarea.value = before + inserted + after;
        const nextPos = before.length + inserted.length;
        textarea.focus();
        textarea.setSelectionRange(nextPos, nextPos);
        savedEditSelection = { start: nextPos, end: nextPos };
        return true;
      }

      function ensureImageTokenInBody(note, imgIdx) {
        const oneBased = imgIdx + 1;
        const lines = String(note.body || '').replace(/\r\n/g, '\n').split('\n');
        const found = lines.some(line => {
          const m = line.trim().match(INLINE_IMG_TOKEN_RE);
          return m && Number(m[2]) === oneBased;
        });
        if (!found) {
          const base = String(note.body || '').trimEnd();
          const token = '![' + t('addPhoto') + '](img:' + oneBased + ')';
          note.body = base ? base + '\n\n' + token : token;
        }
      }

      function setImageAlignmentInNote(note, imgIdx, align) {
        if (!note || !Array.isArray(note.images) || !note.images[imgIdx]) return;
        ensureImageTokenInBody(note, imgIdx);
        const oneBased = imgIdx + 1;
        const suffix = (align === 'left' || align === 'right') ? '|' + align : '';
        const lines = String(note.body || '').replace(/\r\n/g, '\n').split('\n');
        const nextLines = lines.map(line => {
          const m = line.trim().match(INLINE_IMG_TOKEN_RE);
          if (m && Number(m[2]) === oneBased) {
            return '![' + m[1] + '](img:' + oneBased + suffix + ')';
          }
          return line;
        });
        note.body = nextLines.join('\n');
        note.lastHeatedAt = Date.now();
      }

      function moveImageInNote(note, imgIdx, direction) {
        if (!note || !Array.isArray(note.images) || !note.images[imgIdx]) return;
        ensureImageTokenInBody(note, imgIdx);
        const oneBased = imgIdx + 1;
        const rawLines = String(note.body || '').replace(/\r\n/g, '\n').split('\n');

        const blocks = [];
        let buf = [];
        let inCode = false;
        for (let i = 0; i < rawLines.length; i++) {
          const line = rawLines[i];
          if (line.trim().startsWith('```')) {
            buf.push(line);
            inCode = !inCode;
            if (!inCode) {
              blocks.push(buf.join('\n'));
              buf = [];
            }
            continue;
          }
          if (inCode) {
            buf.push(line);
            continue;
          }
          if (!line.trim()) {
            if (buf.length) {
              blocks.push(buf.join('\n'));
              buf = [];
            }
            continue;
          }
          if (INLINE_IMG_TOKEN_RE.test(line.trim())) {
            if (buf.length) {
              blocks.push(buf.join('\n'));
              buf = [];
            }
            blocks.push(line.trim());
            continue;
          }
          buf.push(line);
        }
        if (buf.length) blocks.push(buf.join('\n'));

        const bIdx = blocks.findIndex(b => {
          const m = b.trim().match(INLINE_IMG_TOKEN_RE);
          return m && Number(m[2]) === oneBased;
        });
        if (bIdx === -1) return;

        const targetIdx = direction === 'up' ? bIdx - 1 : bIdx + 1;
        if (targetIdx < 0 || targetIdx >= blocks.length) return;

        const [moved] = blocks.splice(bIdx, 1);
        blocks.splice(targetIdx, 0, moved);
        note.body = blocks.join('\n\n');
        note.lastHeatedAt = Date.now();
      }

      function removeImageFromNote(note, removeIdx) {
        if (!note || !Array.isArray(note.images) || removeIdx < 0 || removeIdx >= note.images.length) return;
        note.images.splice(removeIdx, 1);
        const lines = String(note.body || '').replace(/\r\n/g, '\n').split('\n');
        const nextLines = [];
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const m = line.trim().match(INLINE_IMG_TOKEN_RE);
          if (m) {
            const oneBased = Number(m[2]);
            const zeroBased = oneBased - 1;
            if (zeroBased === removeIdx) {
              continue;
            }
            if (zeroBased > removeIdx) {
              const suffix = m[3] ? '|' + m[3] : '';
              nextLines.push('![' + m[1] + '](img:' + (oneBased - 1) + suffix + ')');
              continue;
            }
          }
          nextLines.push(line);
        }
        note.body = nextLines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
        note.lastHeatedAt = Date.now();
      }

      async function attachFilesToCurrentNote(fileList) {
        const note = state.notes.find(n => n.id === selectedNoteId);
        if (!note || !fileList || !fileList.length) return;
        if (!Array.isArray(note.images)) note.images = [];

        const editBodyBefore = document.getElementById('editBodyInput');
        let cursorSnap = null;
        if (isEditMode && editBodyBefore) {
          if (document.activeElement === editBodyBefore) {
            cursorSnap = { start: editBodyBefore.selectionStart, end: editBodyBefore.selectionEnd };
          } else if (savedEditSelection) {
            cursorSnap = { start: savedEditSelection.start, end: savedEditSelection.end };
          } else {
            cursorSnap = { start: editBodyBefore.value.length, end: editBodyBefore.value.length };
          }
        }

        const newSnippets = [];
        for (const file of Array.from(fileList)) {
          if (!file.type || !file.type.startsWith('image/')) continue;
          try {
            const dataUrl = await compressImageFile(file);
            note.images.push(dataUrl);
            newSnippets.push('![' + t('addPhoto') + '](img:' + note.images.length + ')');
          } catch (err) {
            showToast(t('toastPhotoErr'));
          }
        }

        if (newSnippets.length > 0) {
          const combined = newSnippets.join('\n\n');
          const editBodyEl = document.getElementById('editBodyInput');
          if (isEditMode && editBodyEl && cursorSnap) {
            const start = Math.min(editBodyEl.value.length, Math.max(0, cursorSnap.start));
            const end = Math.min(editBodyEl.value.length, Math.max(start, cursorSnap.end));
            const before = editBodyEl.value.slice(0, start);
            const after = editBodyEl.value.slice(end);
            const lead = before.length > 0 && !before.endsWith('\n') ? '\n' : '';
            const trail = after.length > 0 && !after.startsWith('\n') ? '\n' : '';
            const inserted = lead + combined + trail;
            editBodyEl.value = before + inserted + after;
            const nextPos = before.length + inserted.length;
            savedEditSelection = { start: nextPos, end: nextPos };
            note.body = editBodyEl.value;
            autoResizeTextarea(editBodyEl);
          } else {
            const base = String(note.body || '').trimEnd();
            note.body = base ? base + '\n\n' + combined : combined;
          }

          note.lastHeatedAt = Date.now();
          saveState();
          renderAll(false);
          showToast(t('toastPhotoAdded'));
        }
      }

      /* ==========================================
         7. БЕЗОПАСНЫЙ MARKDOWN-РЕНДЕРЕР
         ========================================== */
      function formatInlineMarkdown(raw) {
        const codeTokens = [];
        let safe = escapeHtml(raw);

        safe = safe.replace(/`([^`]+)`/g, (_, code) => {
          const idx = codeTokens.length;
          codeTokens.push('<code>' + code + '</code>');
          return '\u0000CODE' + idx + '\u0000';
        });

        safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        safe = safe.replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, '<span class="cite-badge">$1</span>');
        safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        safe = safe.replace(/~~([^~]+)~~/g, '<del>$1</del>');
        safe = safe.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
        safe = safe.replace(/\u0000CODE(\d+)\u0000/g, (_, i) => codeTokens[Number(i)] || '');
        return safe;
      }

      function renderNoteBodyHtml(bodyText, imagesArr = []) {
        const lines = String(bodyText || '').replace(/\r\n/g, '\n').split('\n');
        const out = [];
        let listType = null;
        let inCodeBlock = false;
        let codeLines = [];

        function closeList() {
          if (!listType) return;
          out.push(listType === 'ol' ? '</ol>' : '</ul>');
          listType = null;
        }

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const trimmed = line.trim();

          if (trimmed.startsWith('```')) {
            closeList();
            if (!inCodeBlock) {
              inCodeBlock = true;
              codeLines = [];
            } else {
              out.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
              inCodeBlock = false;
              codeLines = [];
            }
            continue;
          }
          if (inCodeBlock) {
            codeLines.push(line);
            continue;
          }

          if (!trimmed) {
            closeList();
            continue;
          }

          const imgTokenMatch = trimmed.match(INLINE_IMG_TOKEN_RE);
          if (imgTokenMatch) {
            closeList();
            const imgIdx = Number(imgTokenMatch[2]) - 1;
            const align = imgTokenMatch[3] || 'full';
            const src = imagesArr[imgIdx];
            if (src) {
              const alignClass = align === 'left' ? ' align-left' : (align === 'right' ? ' align-right' : '');
              out.push(
                '<figure class="md-inline-figure' + alignClass + '">' +
                  '<img src="' + src + '" alt="' + escapeHtml(imgTokenMatch[1] || '') + '" data-lightbox-src="1" draggable="false" />' +
                  buildImageToolbarHtml(imgIdx, align) +
                '</figure>'
              );
            }
            continue;
          }

          if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
            closeList();
            out.push('<hr />');
            continue;
          }

          const headingMatch = line.match(/^(#{1,4})\s+(.+)$/);
          if (headingMatch) {
            closeList();
            const level = headingMatch[1].length;
            out.push('<h' + level + '>' + formatInlineMarkdown(headingMatch[2]) + '</h' + level + '>');
            continue;
          }

          const quoteMatch = line.match(/^>\s?(.*)$/);
          if (quoteMatch) {
            closeList();
            out.push('<blockquote>' + formatInlineMarkdown(quoteMatch[1]) + '</blockquote>');
            continue;
          }

          const checkMatch = line.match(/^\s*[-*]\s+\[([ xX])\]\s*(.*)$/);
          if (checkMatch) {
            if (listType !== 'check') {
              closeList();
              listType = 'check';
              out.push('<ul class="md-checklist">');
            }
            const checked = checkMatch[1].toLowerCase() === 'x';
            out.push(
              '<li class="md-check-item">' +
                '<button type="button" data-toggle-check="' + i + '" class="md-check-box' + (checked ? ' is-checked' : '') + '" aria-pressed="' + checked + '">' +
                  (checked ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : '') +
                '</button>' +
                '<span class="md-check-text' + (checked ? ' is-checked' : '') + '">' + formatInlineMarkdown(checkMatch[2]) + '</span>' +
              '</li>'
            );
            continue;
          }

          const ulMatch = line.match(/^\s*[-*]\s+(.+)$/);
          if (ulMatch) {
            if (listType !== 'ul') {
              closeList();
              listType = 'ul';
              out.push('<ul>');
            }
            out.push('<li>' + formatInlineMarkdown(ulMatch[1]) + '</li>');
            continue;
          }

          const olMatch = line.match(/^\s*\d+\.\s+(.+)$/);
          if (olMatch) {
            if (listType !== 'ol') {
              closeList();
              listType = 'ol';
              out.push('<ol>');
            }
            out.push('<li>' + formatInlineMarkdown(olMatch[1]) + '</li>');
            continue;
          }

          closeList();
          out.push('<p>' + formatInlineMarkdown(line) + '</p>');
        }

        if (inCodeBlock && codeLines.length) {
          out.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
        }
        closeList();
        return out.join('');
      }

        const looseImages = (note.images || [])
          .map((src, idx) => ({ src, idx }))
          .filter(({ idx }) => !referenced.has(idx));

        let imagesHtml = '';
        if (looseImages.length > 0) {
          imagesHtml =
            '<div class="mt-7 grid grid-cols-1 sm:grid-cols-2 gap-3.5">' +

            ? '<div class="mt-6 pt-4 border-t t-border-faint flex flex-wrap gap-3">' +
                note.images.map((src, idx) =>

            ? '<h1 class="text-[26px] sm:text-[30px] font-medium tracking-[-0.02em] t-hot leading-tight m-0 mb-5">' + escapeHtml(note.title.trim()) + '</h1>'
            : '';

            titleHtml +
            '<div id="noteReadBody" class="md-body">' + renderNoteBodyHtml(note.body, note.images || []) + '</div>' +
            imagesHtml;
        }

        readingPane.innerHTML =
          topBarHtml +
          '<article class="w-full max-w-[700px] mx-auto px-5 sm:px-9 py-7 sm:py-10">' +
            contentHtml +
          '</article>';

        if (isEditMode) {
          const titleEl = document.getElementById('editTitleInput');
          const bodyEl = document.getElementById('editBodyInput');
          if (bodyEl) {
            autoResizeTextarea(bodyEl);
            bodyEl.focus();
            const pos = savedEditSelection
              ? Math.min(bodyEl.value.length, savedEditSelection.end)
              : bodyEl.value.length;
            bodyEl.setSelectionRange(pos, pos);
            const rememberCursor = () => {
              savedEditSelection = {
                start: bodyEl.selectionStart,
                end: bodyEl.selectionEnd
              };
            };
            bodyEl.addEventListener('input', () => {
              rememberCursor();
              autoResizeTextarea(bodyEl);
              syncCurrentNoteEdits();
            });
            ['click', 'keyup', 'mouseup', 'select', 'focus', 'blur'].forEach(ev => {
              bodyEl.addEventListener(ev, rememberCursor);
            });
          }
          if (titleEl) {
            titleEl.addEventListener('input', syncCurrentNoteEdits);
          }
        }

        readingPane.scrollTop = resetScroll ? 0 : prevScroll;
      }

      function syncCurrentNoteEdits() {
        const note = state.notes.find(n => n.id === selectedNoteId);
        if (!note) return;
        const titleEl = document.getElementById('editTitleInput');
        const bodyEl = document.getElementById('editBodyInput');
        if (titleEl) note.title = titleEl.value;
        if (bodyEl) note.body = bodyEl.value;
        note.lastHeatedAt = Date.now();
        saveState();
        renderThread();
      }

      function renderAll(resetScroll = false) {
        renderThread();
        renderReadingPane(resetScroll);
      }

      function selectNote(noteId, openOnMobile = true) {
        selectedNoteId = noteId;
        isEditMode = false;
        isNoteMenuOpen = false;
        pendingDeleteNoteId = null;
        savedEditSelection = null;
        if (openOnMobile) {
          document.body.classList.add('mobile-reading-open');
        }
        renderAll(true);
      }

      /* ==========================================
         9. КОНТЕКСТНОЕ МЕНЮ (ПКМ) И МОДАЛКИ

        isNoteMenuOpen = false;
        const dd = readingPane.querySelector('.note-menu-dropdown');

          ctxDeleteTimer = null;
        }
        if (threadContextMenu) {
          threadContextMenu.classList.remove('is-open');
          threadContextMenu.setAttribute('aria-hidden', 'true');

        threadContextMenu.innerHTML =

      function closeAllModals() {
        isNoteMenuOpen = false;
        closeThreadContextMenu();
        newModal.classList.remove('is-open');
        searchModal.classList.remove('is-open');
        restModal.classList.remove('is-open');
        settingsModal.classList.remove('is-open');
        lightboxModal.classList.remove('is-open');
      }

      function isAnyModalOpen() {
        return (
          newModal.classList.contains('is-open') ||
          searchModal.classList.contains('is-open') ||
          restModal.classList.contains('is-open') ||
          settingsModal.classList.contains('is-open') ||
          lightboxModal.classList.contains('is-open')
        );
      }

      function openNewModal() {
        closeAllModals();
        newTitleInput.value = '';
        newBodyInput.value = '';
        newModalImages = [];
        renderNewModalPreview();
        newModal.classList.add('is-open');
        setTimeout(() => newBodyInput.focus(), 30);

      function renderNewModalPreview() {
        newModalPreview.innerHTML = newModalImages.map((src, i) =>
          '<div class="relative w-16 h-16 rounded-xl overflow-hidden border t-border-faint">' +
            '<img src="' + src + '" alt="" class="w-full h-full object-cover" />' +

          '</div>'
        ).join('');
      }

      function saveNewNote() {
        const title = newTitleInput.value.trim();
        let body = newBodyInput.value.trim();
        if (!title && !body && newModalImages.length === 0) {
          closeAllModals();
          return;
        }
        if (newModalImages.length > 0) {
          const used = getReferencedImageIndices(body);
          const extraTokens = [];
          newModalImages.forEach((_, idx) => {
            if (!used.has(idx)) {
              extraTokens.push('![' + t('addPhoto') + '](img:' + (idx + 1) + ')');
            }
          });
          if (extraTokens.length) {
            body = body ? body + '\n\n' + extraTokens.join('\n\n') : extraTokens.join('\n\n');
          }
        }
        const now = Date.now();
        const note = {

          createdAt: now,
          lastHeatedAt: now,

          isRested: false,

      function renderSearchResults(query) {
        const q = query.trim().toLowerCase();
        const matches = state.notes.filter(n => {
          if (!q) return true;
          return (n.title || '').toLowerCase().includes(q) || (n.body || '').toLowerCase().includes(q);
        });
        if (matches.length === 0) {
          searchResults.innerHTML = '<div class="p-6 text-center text-[13px] t-ink-40">' + escapeHtml(t('searchEmpty')) + '</div>';
          return;
        }
        searchResults.innerHTML = matches.slice(0, 40).map(n =>
          '<button type="button" data-search-id="' + escapeHtml(n.id) + '" class="w-full text-left px-3.5 py-2.5 rounded-xl bg-transparent border-0 hover:bg-[color:var(--surface-hover)] cursor-pointer flex items-center justify-between gap-3">' +

              '<div class="text-[12px] t-ink-40 truncate mt-0.5">' + escapeHtml((n.body || '').replace(/\s+/g, ' ').slice(0, 90)) + '</div>' +
            '</div>' +
            '<span class="text-[11px] t-ink-32 shrink-0">' + escapeHtml(getNoteStateLabel(n)) + '</span>' +

      function enterFocusMode() {
        if (!selectedNoteId) return;
        isFocusMode = true;
        isNoteMenuOpen = false;
        document.body.classList.add('focus-mode');
        renderReadingPane(false);
      }

      function exitFocusMode() {
        stopFocusTimer();
        isFocusMode = false;
        document.body.classList.remove('focus-mode');
        renderReadingPane(false);
      }

      function stopFocusTimer() {
        focusRunning = false;
        if (focusTimerId) {
          clearInterval(focusTimerId);
          focusTimerId = null;
        }
      }

      function toggleFocusTimer() {
        if (focusRunning) {
          stopFocusTimer();
          renderReadingPane(false);
          return;
        }
        focusRunning = true;
        renderReadingPane(false);
        focusTimerId = setInterval(() => {
          focusRemainingSec = Math.max(0, focusRemainingSec - 1);
          const el = document.getElementById('focusTimerText');
          if (el) el.textContent = formatTimerDisplay(focusRemainingSec);
          if (focusRemainingSec === 0) {
            stopFocusTimer();
            renderReadingPane(false);
            showToast(t('focusDone'));
          }
        }, 1000);
      }

      /* ==========================================
         11. ИМПОРТ / ЭКСПОРТ (.md и .json)
         ========================================== */
      function triggerDownload(filename, content, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      function exportAllMarkdown() {
        const md = state.notes.map(n => {
          const head = '# ' + deriveTitle(n);
          return head + '\n\n' + (n.body || '');
        }).join('\n\n---\n\n');
        triggerDownload('nerve_notes_' + new Date().toISOString().slice(0, 10) + '.md', md, 'text/markdown;charset=utf-8');
        showToast(t('toastExportedMd'));
      }

      function backupAllJson() {
        const payload = JSON.stringify({ app: 'Nerve', version: 2, exportedAt: Date.now(), state }, null, 2);
        triggerDownload('nerve_backup_' + new Date().toISOString().slice(0, 10) + '.json', payload, 'application/json;charset=utf-8');
        showToast(t('toastBackupSaved'));
      }

      async function handleMdImportFiles(files) {
        let count = 0;
        for (const file of Array.from(files || [])) {
          try {
            const text = (await file.text()).trim();
            if (!text) continue;
            const title = file.name.replace(/\.(md|markdown|txt)$/i, '');
            const now = Date.now() + count;
            state.notes.unshift({
              id: 'imp_' + now + '_' + Math.random().toString(36).slice(2, 6),
              title,
              body: text,
              createdAt: now,
              lastHeatedAt: now,
              isPinned: false,
              isRested: false,
              images: []
            });
            count++;
          } catch (err) {}
        }
        if (count > 0) {
          saveState();
          selectNote(state.notes[0].id, true);
          showToast(t('toastImportedMd', { n: count }));
        } else {
          showToast(t('toastImportEmpty'));
        }
      }

      async function handleJsonRestoreFile(file) {
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          const src = parsed && parsed.state ? parsed.state : parsed;
          if (!src || !Array.isArray(src.notes)) {
            showToast(t('toastInvalidJson'));
            return;
          }
          state.notes = src.notes.map(normalizeNote);
          if (src.theme) applyTheme(src.theme);
          if (src.lang && I18N[src.lang]) state.lang = src.lang;
          if (src.coolingDays) state.coolingDays = Math.max(1, Math.min(365, Number(src.coolingDays) || 30));
          saveState();
          applyI18nToStaticDom();
          const { active } = getPartitionedNotes();
          selectedNoteId = active.length ? active[0].id : null;
          renderAll(true);
          closeAllModals();
          showToast(t('toastRestoredJson', { n: state.notes.length }));
        } catch (err) {
          showToast(t('toastInvalidJson'));
        }
      }

      nodesRow.addEventListener('contextmenu', (e) => {

      threadContextMenu.addEventListener('click', (e) => {
        e.stopPropagation();
        const btn = e.target.closest('[data-ctx-action]');
        if (!btn || !contextMenuNoteId) return;
        const act = btn.dataset.ctxAction;
        const note = state.notes.find(n => n.id === contextMenuNoteId);
        if (!note) {
          closeThreadContextMenu();
          return;
        }

        if (act === 'copy') {
          const fullText = (note.title ? note.title + '\n\n' : '') + (note.body || '');
          copyTextToClipboard(fullText.trim());
          closeThreadContextMenu();
          showToast(t('toastCopied'));
        } else if (act === 'pin') {
          note.isPinned = !note.isPinned;
          if (note.isPinned) {
            note.isRested = false;
            note.lastHeatedAt = Date.now();
          }
          closeThreadContextMenu();
          saveState();
          renderAll(false);
          showToast(t(note.isPinned ? 'toastPinned' : 'toastUnpinned'));
        } else if (act === 'heat') {
          note.isRested = false;
          note.lastHeatedAt = Date.now();
          closeThreadContextMenu();
          saveState();
          renderAll(false);
          showToast(t('toastHeated'));
        } else if (act === 'archive') {
          const archived = isNoteArchived(note);
          if (archived) {
            note.isRested = false;
            note.lastHeatedAt = Date.now();
            showToast(t('toastWoke'));
          } else {
            note.isPinned = false;
            note.isRested = true;
            showToast(t('toastRested'));
            if (selectedNoteId === note.id) {
              const { active } = getPartitionedNotes();
              selectedNoteId = active.length > 0 ? active[0].id : null;
              if (!selectedNoteId) document.body.classList.remove('mobile-reading-open');
            }
          }
          closeThreadContextMenu();
          saveState();
          renderAll(true);
        } else if (act === 'delete') {
          if (pendingCtxDeleteId === note.id) {
            state.notes = state.notes.filter(n => n.id !== note.id);
            if (selectedNoteId === note.id) {
              const { active } = getPartitionedNotes();
              selectedNoteId = active.length > 0 ? active[0].id : null;
              if (!selectedNoteId) document.body.classList.remove('mobile-reading-open');
            }
            closeThreadContextMenu();
            saveState();
            renderAll(true);
            showToast(t('toastDeleted'));
          } else {
            pendingCtxDeleteId = note.id;
            const rect = threadContextMenu.getBoundingClientRect();
            openThreadContextMenu(note.id, rect.left, rect.top);
            ctxDeleteTimer = setTimeout(() => {
              if (pendingCtxDeleteId === note.id) {
                pendingCtxDeleteId = null;
                if (contextMenuNoteId === note.id) {
                  const r = threadContextMenu.getBoundingClientRect();
                  openThreadContextMenu(note.id, r.left, r.top);

      readingPane.addEventListener('click', (e) => {
        const moveImgBtn = e.target.closest('[data-img-move]');
        if (moveImgBtn) {
          e.stopPropagation();
          const note = state.notes.find(n => n.id === selectedNoteId);
          const idx = Number(moveImgBtn.dataset.imgMove);
          const dir = moveImgBtn.dataset.dir;
          if (note && Number.isInteger(idx) && (dir === 'up' || dir === 'down')) {
            moveImageInNote(note, idx, dir);
            saveState();
            renderAll(false);
          }
          return;
        }

        const alignImgBtn = e.target.closest('[data-img-align]');
        if (alignImgBtn) {
          e.stopPropagation();
          const note = state.notes.find(n => n.id === selectedNoteId);
          const idx = Number(alignImgBtn.dataset.imgAlign);
          const align = alignImgBtn.dataset.align;
          if (note && Number.isInteger(idx)) {
            setImageAlignmentInNote(note, idx, align);
            saveState();
            renderAll(false);
          }
          return;
        }

        const remImgBtn = e.target.closest('[data-remove-img]');
        if (remImgBtn) {
          e.stopPropagation();
          const note = state.notes.find(n => n.id === selectedNoteId);
          const idx = Number(remImgBtn.dataset.removeImg);
          if (note && Number.isInteger(idx)) {
            removeImageFromNote(note, idx);
            saveState();
            renderAll(false);
            showToast(t('toastPhotoRemoved'));
          }
          return;
        }

        const lbImg = e.target.closest('[data-lightbox-src]');
        if (lbImg) {
          lightboxImg.src = lbImg.getAttribute('src') || '';
          lightboxModal.classList.add('is-open');
          return;
        }

        const checkBtn = e.target.closest('[data-toggle-check]');
        if (checkBtn) {
          const note = state.notes.find(n => n.id === selectedNoteId);
          const lineIdx = Number(checkBtn.dataset.toggleCheck);
          if (note && Number.isInteger(lineIdx)) {
            const lines = String(note.body || '').replace(/\r\n/g, '\n').split('\n');
            if (lines[lineIdx] !== undefined) {
              const isCheckedNow = /^\s*[-*]\s+\[[xX]\]/.test(lines[lineIdx]);
              lines[lineIdx] = isCheckedNow
                ? lines[lineIdx].replace(/\[[xX]\]/, '[ ]')
                : lines[lineIdx].replace(/\[ \]/, '[x]');
              note.body = lines.join('\n');
              note.lastHeatedAt = Date.now();
              saveState();

              const nextChecked = !isCheckedNow;
              checkBtn.classList.toggle('is-checked', nextChecked);
              checkBtn.setAttribute('aria-pressed', String(nextChecked));
              checkBtn.innerHTML = nextChecked
                ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
                : '';
              const textEl = checkBtn.nextElementSibling;
              if (textEl) textEl.classList.toggle('is-checked', nextChecked);
              renderThread();
            }
          }
          return;
        }

        const presetBtn = e.target.closest('[data-focus-preset]');
        if (presetBtn) {
          stopFocusTimer();
          focusDurationSec = Number(presetBtn.dataset.focusPreset) * 60;
          focusRemainingSec = focusDurationSec;
          renderReadingPane(false);
          return;
        }

        const actionBtn = e.target.closest('[data-action]');
        if (!actionBtn) return;
        const action = actionBtn.dataset.action;
        const note = state.notes.find(n => n.id === selectedNoteId);

        if (action === 'back-mobile') {
          document.body.classList.remove('mobile-reading-open');
          return;
        }
        if (action === 'focus-exit') {
          exitFocusMode();
          return;
        }
        if (action === 'focus-toggle-timer') {
          toggleFocusTimer();
          return;
        }
        if (action === 'focus-reset') {
          stopFocusTimer();
          focusRemainingSec = focusDurationSec;
          renderReadingPane(false);
          return;
        }

        if (!note) return;

        if (action === 'toggle-edit') {
          isEditMode = !isEditMode;
          isNoteMenuOpen = false;
          renderReadingPane(false);
        } else if (action === 'add-photo') {
          isNoteMenuOpen = false;
          noteImageInput.click();
        } else if (action === 'focus-enter') {
          enterFocusMode();
        } else if (action === 'toggle-menu') {
          e.stopPropagation();
          isNoteMenuOpen = !isNoteMenuOpen;
          const dd = readingPane.querySelector('.note-menu-dropdown');
          if (dd) dd.classList.toggle('is-open', isNoteMenuOpen);
        } else if (action === 'copy') {
          const fullText = (note.title ? note.title + '\n\n' : '') + (note.body || '');
          copyTextToClipboard(fullText.trim());
          closeNoteMenuDom();
          showToast(t('toastCopied'));
        } else if (action === 'pin') {
          note.isPinned = !note.isPinned;
          if (note.isPinned) {
            note.isRested = false;
            note.lastHeatedAt = Date.now();
          }
          isNoteMenuOpen = false;
          saveState();
          renderAll(false);
          showToast(t(note.isPinned ? 'toastPinned' : 'toastUnpinned'));
        } else if (action === 'heat') {
          note.isRested = false;
          note.lastHeatedAt = Date.now();
          isNoteMenuOpen = false;
          saveState();
          renderAll(false);
          showToast(t('toastHeated'));
        } else if (action === 'archive') {
          const archived = isNoteArchived(note);
          if (archived) {
            note.isRested = false;
            note.lastHeatedAt = Date.now();
            showToast(t('toastWoke'));
          } else {
            note.isPinned = false;
            note.isRested = true;
            showToast(t('toastRested'));
            const { active } = getPartitionedNotes();
            selectedNoteId = active.length > 0 ? active[0].id : null;
            if (!selectedNoteId) document.body.classList.remove('mobile-reading-open');
          }
          isNoteMenuOpen = false;
          saveState();
          renderAll(true);
        } else if (action === 'delete') {
          e.stopPropagation();
          if (pendingDeleteNoteId === note.id) {
            state.notes = state.notes.filter(n => n.id !== note.id);
            const { active } = getPartitionedNotes();
            selectedNoteId = active.length > 0 ? active[0].id : null;
            if (!selectedNoteId) document.body.classList.remove('mobile-reading-open');
            pendingDeleteNoteId = null;
            isNoteMenuOpen = false;
            saveState();
            renderAll(true);
            showToast(t('toastDeleted'));
          } else {
            pendingDeleteNoteId = note.id;
            renderReadingPane(false);
            clearTimeout(deleteConfirmTimer);
            deleteConfirmTimer = setTimeout(() => {
              if (pendingDeleteNoteId === note.id) {
                pendingDeleteNoteId = null;
                renderReadingPane(false);
              }
            }, 3500);
          }
        }
      });

      readingPane.addEventListener('dblclick', (e) => {
        if (!selectedNoteId || isEditMode) return;
        if (e.target.closest('#noteReadBody') && !e.target.closest('button, a, img, .img-toolbar')) {
          isEditMode = true;

      document.addEventListener('paste', (e) => {
        if (!selectedNoteId || isAnyModalOpen()) return;
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        const imageFiles = [];
        for (const item of Array.from(items)) {
          if (item.kind === 'file' && item.type && item.type.startsWith('image/')) {
            const file = item.getAsFile();
            if (file) {
              imageFiles.push(file);
              break;
            }
          }
        }
        if (imageFiles.length > 0) {
          e.preventDefault();
          attachFilesToCurrentNote(imageFiles);
        }
      });

      readingPane.addEventListener('dragover', (e) => {
        if (selectedNoteId) e.preventDefault();
      });
      readingPane.addEventListener('drop', (e) => {
        if (!selectedNoteId || !e.dataTransfer) return;

        const files = e.dataTransfer.files;
        if (files && files.length) {
          e.preventDefault();
          e.stopPropagation();
          attachFilesToCurrentNote(files);
          return;
        }

        const plain = e.dataTransfer.getData('text/plain') || '';
        const uri = e.dataTransfer.getData('text/uri-list') || '';
        if (plain.startsWith('data:image/') || uri.startsWith('data:image/')) {
          e.preventDefault();
          e.stopPropagation();
        }
      });

      document.addEventListener('click', (e) => {
        if (isNoteMenuOpen && !e.target.closest('.note-menu-wrap')) {
          closeNoteMenuDom();
        }
        if (contextMenuNoteId && !e.target.closest('#threadContextMenu')) {
          closeThreadContextMenu();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (contextMenuNoteId) {
            closeThreadContextMenu();
            return;
          }
          if (isNoteMenuOpen) {
            closeNoteMenuDom();
            return;
          }
          if (isAnyModalOpen()) {
            closeAllModals();
            return;
          }
          if (isEditMode) {
            isEditMode = false;
            renderReadingPane(false);
            return;
          }
          if (isFocusMode) {
            exitFocusMode();
            return;
          }
        }

        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          if (newModal.classList.contains('is-open')) {
            e.preventDefault();
            saveNewNote();
            return;
          }
          if (isEditMode) {
            e.preventDefault();
            isEditMode = false;
            renderReadingPane(false);
            return;
          }
        }

        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || isAnyModalOpen() || e.ctrlKey || e.metaKey || e.altKey) {
          return;
        }

        if (e.code === 'KeyN') {
          e.preventDefault();
          openNewModal();
        } else if (e.code === 'KeyE' && selectedNoteId) {
          e.preventDefault();
          isEditMode = !isEditMode;
          renderReadingPane(false);
        } else if (e.code === 'KeyF' && selectedNoteId) {
          e.preventDefault();
          if (isFocusMode) exitFocusMode();
          else enterFocusMode();
        } else if (e.code === 'Slash' || e.key === '/') {
          e.preventDefault();
          openSearchModal();
        }
      });

      /* ==========================================
         14. СТАРТ ПРИЛОЖЕНИЯ
         ========================================== */
      async function init() {
        await loadState();
        applyTheme(state.theme);
        applyI18nToStaticDom();
        const { active } = getPartitionedNotes();
        if (active.length > 0) {
          selectedNoteId = active[0].id;
        }
        renderAll(true);
      }

      init();
    })();
  </script>
</body>
</html>
