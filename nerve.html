<!DOCTYPE html>
<html lang="ru" class="theme-dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta id="metaColorScheme" name="color-scheme" content="dark" />
  <meta id="metaThemeColor" name="theme-color" content="#0A0B0D" />
  <title>Nerve</title>

  <!-- Иконка вкладки «Синапс» -->
  <link
    id="faviconLink"
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='%230A0B0D'/%3E%3Cline x1='11' y1='11' x2='25' y2='25' stroke='%23F2F1EC' stroke-opacity='0.45' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='11' cy='11' r='5' fill='%23F2F1EC'/%3E%3Ccircle cx='25' cy='25' r='4.4' fill='%230A0B0D' stroke='%23F2F1EC' stroke-opacity='0.75' stroke-width='2.2'/%3E%3C/svg%3E"
  />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Шрифт Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================
       ПАЛИТРЫ И ТЕПЛОВЫЕ ТОКЕНЫ (4 ТЕМЫ)
       ========================================== */
    :root,
    html.theme-dark {
      color-scheme: dark;
      --bg: #0A0B0D;
      --surface: #111215;
      --surface-elevated: #17191E;
      --hover-bg: rgba(255, 255, 255, 0.045);
      --chip-bg: rgba(255, 255, 255, 0.085);
      --border-faint: rgba(255, 255, 255, 0.055);
      --border-subtle: rgba(255, 255, 255, 0.11);
      --hot: #F2F1EC;
      --ink-84: rgba(242, 241, 236, 0.84);
      --ink-62: rgba(242, 241, 236, 0.62);
      --ink-40: rgba(242, 241, 236, 0.42);
      --ink-32: rgba(242, 241, 236, 0.30);
      --ink-18: rgba(242, 241, 236, 0.16);
      --thread-line: rgba(242, 241, 236, 0.11);
      --glow: rgba(242, 241, 236, 0.28);
      --danger: #E06C6C;
      --code-bg: rgba(255, 255, 255, 0.055);
      --overlay: rgba(4, 5, 7, 0.72);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html.theme-light {
      color-scheme: only light;
      --bg: #F4F3EE;
      --surface: #ECEAE2;
      --surface-elevated: #FAFAF7;
      --hover-bg: rgba(22, 23, 26, 0.045);
      --chip-bg: rgba(22, 23, 26, 0.08);
      --border-faint: rgba(22, 23, 26, 0.07);
      --border-subtle: rgba(22, 23, 26, 0.13);
      --hot: #16171A;
      --ink-84: rgba(22, 23, 26, 0.84);
      --ink-62: rgba(22, 23, 26, 0.62);
      --ink-40: rgba(22, 23, 26, 0.44);
      --ink-32: rgba(22, 23, 26, 0.32);
      --ink-18: rgba(22, 23, 26, 0.16);
      --thread-line: rgba(22, 23, 26, 0.13);
      --glow: rgba(22, 23, 26, 0.16);
      --danger: #C24141;
      --code-bg: rgba(22, 23, 26, 0.055);
      --overlay: rgba(22, 23, 26, 0.36);
    }

    html.theme-sepia {
      color-scheme: only light;
      --bg: #EBE3D2;
      --surface: #E2D8C3;
      --surface-elevated: #F2EBDC;
      --hover-bg: rgba(42, 33, 27, 0.05);
      --chip-bg: rgba(42, 33, 27, 0.09);
      --border-faint: rgba(42, 33, 27, 0.08);
      --border-subtle: rgba(42, 33, 27, 0.14);
      --hot: #2A211B;
      --ink-84: rgba(42, 33, 27, 0.86);
      --ink-62: rgba(42, 33, 27, 0.64);
      --ink-40: rgba(42, 33, 27, 0.46);
      --ink-32: rgba(42, 33, 27, 0.34);
      --ink-18: rgba(42, 33, 27, 0.18);
      --thread-line: rgba(42, 33, 27, 0.15);
      --glow: rgba(42, 33, 27, 0.15);
      --danger: #B34038;
      --code-bg: rgba(42, 33, 27, 0.06);
      --overlay: rgba(34, 26, 20, 0.42);
    }

    html.theme-slate {
      color-scheme: dark;
      --bg: #12151A;
      --surface: #181C23;
      --surface-elevated: #1F252F;
      --hover-bg: rgba(230, 234, 240, 0.05);
      --chip-bg: rgba(230, 234, 240, 0.095);
      --border-faint: rgba(230, 234, 240, 0.065);
      --border-subtle: rgba(230, 234, 240, 0.12);
      --hot: #E6EAF0;
      --ink-84: rgba(230, 234, 240, 0.85);
      --ink-62: rgba(230, 234, 240, 0.64);
      --ink-40: rgba(230, 234, 240, 0.44);
      --ink-32: rgba(230, 234, 240, 0.30);
      --ink-18: rgba(230, 234, 240, 0.16);
      --thread-line: rgba(230, 234, 240, 0.12);
      --glow: rgba(230, 234, 240, 0.24);
      --danger: #E07575;
      --code-bg: rgba(230, 234, 240, 0.06);
      --overlay: rgba(7, 9, 13, 0.72);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--hot);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.24s ease, color 0.24s ease;
    }

    /* Утилиты цветов темы */
    .t-bg { background-color: var(--bg); }
    .t-surface { background-color: var(--surface); }
    .t-elevated { background-color: var(--surface-elevated); }
    .t-hot { color: var(--hot); }
    .t-ink-84 { color: var(--ink-84); }
    .t-ink-62 { color: var(--ink-62); }
    .t-ink-40 { color: var(--ink-40); }
    .t-ink-32 { color: var(--ink-32); }
    .t-border-faint { border-color: var(--border-faint); }
    .t-border-subtle { border-color: var(--border-subtle); }

    /* Тонкие скроллбары */
    .quiet-scroll {
      scrollbar-width: thin;
      scrollbar-color: var(--border-subtle) transparent;
    }
    .quiet-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .quiet-scroll::-webkit-scrollbar-track { background: transparent; }
    .quiet-scroll::-webkit-scrollbar-thumb {
      background-color: var(--border-subtle);
      border-radius: 9999px;
    }

    /* Логотип возврата к истокам */
    .logo-home-btn {
      transition: opacity 0.2s ease, transform 0.2s var(--ease);
    }
    .logo-home-btn:hover svg,
    .logo-home-btn:hover span {
      color: var(--hot);
    }
    .logo-home-btn:active {
      transform: scale(0.97);
    }

    /* Верхние тихие кнопки */
    .header-ghost-btn {
      color: var(--ink-40);
      background: transparent;
      border: 0;
      padding: 6px 8px;
      border-radius: 9999px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.18s ease, background-color 0.18s ease;
    }
    .header-ghost-btn:hover {
      color: var(--hot);
      background-color: var(--hover-bg);
    }

    .header-pill-btn {
      color: var(--hot);
      background-color: var(--hover-bg);
      border: 1px solid var(--border-subtle);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.15s ease;
    }
    .header-pill-btn:hover {
      background-color: var(--chip-bg);
      border-color: var(--ink-32);
    }
    .header-pill-btn:active {
      transform: scale(0.98);
    }

    .kbd-hint {
      font-size: 10.5px;
      color: var(--ink-32);
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    /* ==========================================
       ВЕРТИКАЛЬНАЯ ОСТЫВАЮЩАЯ НИТЬ (СЛЕВА)
       ========================================== */
    .thread-column {
      border-right: 1px solid var(--border-faint);
      background-color: var(--bg);
    }

    .thread-track {
      position: relative;
    }
    .thread-track::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 16px;
      bottom: 24px;
      width: 1px;
      background: linear-gradient(
        to bottom,
        var(--thread-line) 0%,
        var(--thread-line) 85%,
        transparent 100%
      );
      pointer-events: none;
    }

    .thread-node {
      position: relative;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 12px;
      padding: 10px 12px 10px 34px;
      cursor: pointer;
      transition: background-color 0.16s ease, opacity 0.2s ease;
    }
    .thread-node:hover {
      background-color: var(--hover-bg);
    }
    .thread-node.is-selected {
      background-color: var(--chip-bg);
    }

    .node-dot {
      position: absolute;
      left: 11px;
      top: 17px;
      width: 9px;
      height: 9px;
      border-radius: 9999px;
      transition: transform 0.2s var(--ease), background-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* Тепловые состояния узлов */
    .thermal-hot .node-dot {
      background-color: var(--hot);
      box-shadow: 0 0 10px var(--glow);
    }
    .thermal-hot .node-title { color: var(--hot); }
    .thermal-hot .node-preview { color: var(--ink-62); }
    .thermal-hot .node-meta { color: var(--ink-40); }

    .thermal-cooling .node-dot {
      background-color: var(--ink-62);
      transform: scale(0.86);
    }
    .thermal-cooling .node-title { color: var(--ink-84); }
    .thermal-cooling .node-preview { color: var(--ink-40); }
    .thermal-cooling .node-meta { color: var(--ink-32); }

    .thermal-cold .node-dot {
      background-color: var(--bg);
      border: 1.5px solid var(--ink-40);
      transform: scale(0.8);
    }
    .thermal-cold .node-title { color: var(--ink-62); }
    .thermal-cold .node-preview { color: var(--ink-32); }
    .thermal-cold .node-meta { color: var(--ink-32); }

    /* Узел «Покой» внизу нити */
    .rest-node {
      position: relative;
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px 10px 34px;
      border-radius: 12px;
      border: 0;
      background: transparent;
      color: var(--ink-40);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color 0.16s ease, color 0.16s ease;
    }
    .rest-node:hover {
      background-color: var(--hover-bg);
      color: var(--hot);
    }
    .rest-dot {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 9px;
      height: 9px;
      border-radius: 9999px;
      background-color: var(--bg);
      border: 1.5px dashed var(--ink-40);
    }

    /* Плавное появление заметки */
    .reading-fade-in {
      animation: readingIn 0.22s var(--ease) both;
    }
    @keyframes readingIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Иконочные кнопки панели заметки */
    .icon-action-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 0;
      background: transparent;
      color: var(--ink-40);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.16s ease, color 0.16s ease;
    }
    .icon-action-btn:hover {
      background-color: var(--hover-bg);
      color: var(--hot);
    }
    .icon-action-btn.is-active {
      background-color: var(--chip-bg);
      color: var(--hot);
    }
    .icon-action-btn.is-danger:hover {
      color: var(--danger);
      background-color: rgba(224, 108, 108, 0.1);
    }

    /* Выпадающее меню действий заметки (···) с понятными подписями */
    .note-menu-wrap {
      position: relative;
    }
    .note-menu-popover {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 220px;
      background-color: var(--surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.36);
      z-index: 40;
      display: none;
      flex-direction: column;
      gap: 2px;
    }
    .note-menu-popover.is-open {
      display: flex;
      animation: cardPop 0.16s var(--ease) both;
    }
    .note-menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 10px;
      border: 0;
      background: transparent;
      color: var(--ink-84);
      font-size: 13.5px;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.14s ease, color 0.14s ease;
    }
    .note-menu-item:hover {
      background-color: var(--hover-bg);
      color: var(--hot);
    }
    .note-menu-item.is-active {
      color: var(--hot);
      background-color: var(--chip-bg);
    }
    .note-menu-item.is-danger {
      color: var(--danger);
    }
    .note-menu-item.is-danger:hover {
      background-color: rgba(224, 108, 108, 0.12);
    }
    .note-menu-divider {
      height: 1px;
      background-color: var(--border-faint);
      margin: 4px 6px;
    }

    /* ==========================================
       ТИПОГРАФИКА MARKDOWN + NOTEBOOKLM + ЧЕКБОКСЫ
       ========================================== */
    .md-body {
      font-size: 15.5px;
      line-height: 1.72;
      color: var(--ink-84);
      word-break: break-word;
    }
    .md-body h1 {
      font-size: 1.45em;
      font-weight: 500;
      color: var(--hot);
      margin: 1.3em 0 0.5em;
      letter-spacing: -0.015em;
      line-height: 1.3;
    }
    .md-body h2 {
      font-size: 1.24em;
      font-weight: 500;
      color: var(--hot);
      margin: 1.25em 0 0.45em;
      letter-spacing: -0.01em;
      line-height: 1.35;
    }
    .md-body h3, .md-body h4 {
      font-size: 1.06em;
      font-weight: 500;
      color: var(--hot);
      margin: 1.1em 0 0.4em;
      line-height: 1.4;
    }
    .md-body > :first-child { margin-top: 0; }
    .md-body p {
      margin: 0 0 0.9em;
    }
    .md-body strong {
      font-weight: 600;
      color: var(--hot);
    }
    .md-body em {
      font-style: italic;
    }
    .md-body del {
      color: var(--ink-40);
      text-decoration: line-through;
    }
    .md-body a {
      color: var(--hot);
      text-decoration: underline;
      text-decoration-color: var(--ink-32);
      text-underline-offset: 3px;
      transition: text-decoration-color 0.16s ease;
    }
    .md-body a:hover {
      text-decoration-color: var(--hot);
    }
    .md-body blockquote {
      margin: 1em 0;
      padding: 4px 0 4px 16px;
      border-left: 2px solid var(--border-subtle);
      color: var(--ink-62);
    }
    .md-body ul, .md-body ol {
      margin: 0.4em 0 1em;
      padding-left: 22px;
    }
    .md-body ul { list-style-type: disc; }
    .md-body ol { list-style-type: decimal; }
    .md-body li {
      margin: 0.28em 0;
    }
    .md-body li::marker {
      color: var(--ink-32);
    }
    .md-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88em;
      background-color: var(--code-bg);
      padding: 2px 6px;
      border-radius: 6px;
      color: var(--hot);
    }
    .md-body pre {
      margin: 1em 0;
      padding: 14px 16px;
      border-radius: 12px;
      background-color: var(--surface);
      border: 1px solid var(--border-faint);
      overflow-x: auto;
    }
    .md-body pre code {
      background: transparent;
      padding: 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--ink-84);
    }
    .md-body hr {
      border: 0;
      border-top: 1px solid var(--border-faint);
      margin: 1.5em 0;
    }

    /* Тихие сноски NotebookLM [1], [2, 3] */
    .nlm-cite {
      font-size: 0.72em;
      color: var(--ink-32);
      margin-left: 2px;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    /* Интерактивные чекбоксы */
    .md-checklist {
      list-style: none !important;
      padding-left: 0 !important;
      margin: 0.5em 0 1em;
    }
    .md-check-item {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 4px 0;
      cursor: pointer;
      user-select: none;
    }
    .md-check-box {
      width: 17px;
      height: 17px;
      margin-top: 4px;
      border-radius: 5px;
      border: 1.4px solid var(--ink-40);
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.16s ease, border-color 0.16s ease;
    }
    .md-check-item:hover .md-check-box {
      border-color: var(--hot);
    }
    .md-check-item.is-checked .md-check-box {
      background-color: var(--hot);
      border-color: var(--hot);
      color: var(--bg);
    }
    .md-check-item.is-checked .md-check-text {
      color: var(--ink-40);
      text-decoration: line-through;
      text-decoration-color: var(--ink-32);
    }

    /* ==========================================
       МОБИЛЬНАЯ НАВИГАЦИЯ (НИТЬ <-> ЗАМЕТКА)
       ========================================== */
    @media (max-width: 767px) {
      .thread-column {
        width: 100% !important;
        border-right: 0;
      }
      .reading-pane {
        display: none;
      }
      body.mobile-reading-open .thread-column {
        display: none;
      }
      body.mobile-reading-open .reading-pane {
        display: flex;
      }
    }

    /* ==========================================
       РЕЖИМ ФОКУСА (F)
       ========================================== */
    body.focus-mode .app-header {
      display: none !important;
    }
    body.focus-mode .thread-column {
      display: none !important;
    }
    body.focus-mode .reading-pane {
      display: flex !important;
      width: 100%;
    }
    body.focus-mode .normal-note-toolbar {
      display: none !important;
    }
    body.focus-mode .focus-bar {
      display: flex !important;
    }

    /* ==========================================
       НАСТРОЙКИ И МОДАЛКИ
       ========================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: var(--overlay);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.is-open {
      display: flex;
      animation: modalFade 0.18s ease both;
    }
    @keyframes modalFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      width: 100%;
      background-color: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      animation: cardPop 0.22s var(--ease) both;
    }
    @keyframes cardPop {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Выбор темы */
    .theme-swatch-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 8px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-62);
      font-size: 12.5px;
      cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }
    .theme-swatch-btn:hover {
      background-color: var(--hover-bg);
      color: var(--hot);
    }
    .theme-swatch-btn.is-selected {
      background-color: var(--chip-bg);
      border-color: var(--border-subtle);
      color: var(--hot);
    }

    /* Кнопки языка и срока остывания */
    .pill-choice-btn,
    .cooling-option-btn {
      padding: 6px 13px;
      border-radius: 9999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-62);
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }
    .pill-choice-btn:hover,
    .cooling-option-btn:hover {
      background-color: var(--hover-bg);
      color: var(--hot);
    }
    .pill-choice-btn.is-selected,
    .cooling-option-btn.is-selected {
      color: var(--hot);
      background-color: var(--chip-bg);
      border-color: var(--border-subtle);
    }

    /* Поле кастомного срока остывания */
    .custom-cooling-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 11px;
      border-radius: 9999px;
      background-color: transparent;
      border: 1px solid var(--border-subtle);
      transition: background-color 0.18s ease, border-color 0.18s ease;
      cursor: text;
    }
    .custom-cooling-pill:hover,
    .custom-cooling-pill:focus-within {
      background-color: var(--hover-bg);
      border-color: var(--ink-32);
    }
    .custom-cooling-pill.is-selected {
      background-color: var(--chip-bg);
      border-color: var(--border-subtle);
    }
    .custom-cooling-input {
      width: 44px;
      background: transparent;
      border: 0;
      padding: 0;
      font-size: 13px;
      color: var(--hot);
      text-align: center;
      font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }
    .custom-cooling-input:focus { outline: none; }
    .custom-cooling-input::placeholder { color: var(--ink-32); }
    .custom-cooling-input::-webkit-outer-spin-button,
    .custom-cooling-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Кнопки данных в Настройках */
    .data-btn {
      padding: 8px 13px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background-color: transparent;
      color: var(--ink-84);
      font-size: 12.5px;
      cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }
    .data-btn:hover {
      background-color: var(--hover-bg);
      border-color: var(--ink-32);
      color: var(--hot);
    }

    /* Тост уведомлений */
    .toast-pill {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 16px);
      background-color: var(--surface-elevated);
      color: var(--hot);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 9px 18px;
      font-size: 13px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      opacity: 0;
      pointer-events: none;
      z-index: 80;
      transition: opacity 0.22s ease, transform 0.24s var(--ease);
      max-width: calc(100vw - 32px);
      text-align: center;
    }
    .toast-pill.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Drag & Drop подсветка */
    .drop-active {
      outline: 1.5px dashed var(--ink-40);
      outline-offset: -8px;
    }
  </style>
</head>

      // ==========================================
      // 4. ДВОЙНОЕ ХРАНИЛИЩЕ (INDEXEDDB + LOCALSTORAGE)
      // ==========================================
      function openDB() {
        return new Promise((resolve, reject) => {
          if (!('indexedDB' in window)) {
            reject(new Error('IndexedDB unavailable'));
            return;
          }
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(DB_STORE)) {
              db.createObjectStore(DB_STORE);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbGet(key) {
        try {
          const db = await openDB();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, 'readonly');
            const store = tx.objectStore(DB_STORE);
            const req = store.get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
        } catch (e) {
          return null;
        }
      }

      async function idbSet(key, val) {
        try {
          const db = await openDB();
          await new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, 'readwrite');
            const store = tx.objectStore(DB_STORE);
            const req = store.put(val, key);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
          });
          return true;
        } catch (e) {
          return false;
        }
      }

      function normalizeNotes(arr) {
        if (!Array.isArray(arr)) return [];
        const now = Date.now();
        return arr
          .filter(item => item && typeof item === 'object')
          .map(item => ({
            id: typeof item.id === 'string' && item.id ? item.id : createId(),
            title: typeof item.title === 'string' ? item.title : '',
            body: typeof item.body === 'string' ? item.body : '',
            createdAt: typeof item.createdAt === 'number' && Number.isFinite(item.createdAt) ? item.createdAt : now,
            lastHeatedAt: typeof item.lastHeatedAt === 'number' && Number.isFinite(item.lastHeatedAt)
              ? item.lastHeatedAt
              : (typeof item.createdAt === 'number' ? item.createdAt : now),
            isPinned: Boolean(item.isPinned),
            isRested: Boolean(item.isRested),
            images: Array.isArray(item.images) ? item.images.filter(s => typeof s === 'string') : []
          }));
      }

      async function loadState() {
        let cachedTheme = null;
        let cachedLang = null;
        try {
          cachedTheme = localStorage.getItem(LS_THEME_KEY);
          cachedLang = localStorage.getItem(LS_LANG_KEY);
        } catch (e) {}

        let saved = await idbGet(DB_STATE_KEY);
        if (!saved) {
          try {
            const rawLs = localStorage.getItem(LS_BACKUP_KEY);
            if (rawLs) saved = JSON.parse(rawLs);
          } catch (e) {}
        }

        if (saved && Array.isArray(saved.notes)) {
          state.lang = VALID_LANGS.includes(saved.lang)
            ? saved.lang
            : (VALID_LANGS.includes(cachedLang) ? cachedLang : detectBrowserLang());
          state.notes = normalizeNotes(saved.notes);
          state.theme = VALID_THEMES.includes(saved.theme)
            ? saved.theme
            : (VALID_THEMES.includes(cachedTheme) ? cachedTheme : 'dark');
          state.coolingDays = normalizeCoolingDays(saved.coolingDays) || 14;
        } else {
          state.lang = VALID_LANGS.includes(cachedLang) ? cachedLang : detectBrowserLang();
          state.theme = VALID_THEMES.includes(cachedTheme) ? cachedTheme : 'dark';
          state.coolingDays = 14;
          state.notes = createStarterNotes(state.lang);
          await saveState();
        }

        applyTheme(state.theme, false);
        updateSettingsUI();
      }

      async function saveState() {
        const snapshot = {
          notes: state.notes,
          theme: state.theme,
          lang: state.lang,
          coolingDays: state.coolingDays,
          updatedAt: Date.now()
        };

        await idbSet(DB_STATE_KEY, snapshot);

        // Лёгкая страховка в localStorage (тексты и настройки, без переполнения квоты)
        try {
          localStorage.setItem(LS_THEME_KEY, state.theme);
          localStorage.setItem(LS_LANG_KEY, state.lang);
          const lightNotes = state.notes.map(n => ({
            id: n.id,
            title: n.title,
            body: n.body,
            createdAt: n.createdAt,
            lastHeatedAt: n.lastHeatedAt,
            isPinned: n.isPinned,
            isRested: n.isRested,
            images: n.images.length <= 2 ? n.images : []
          }));
          localStorage.setItem(LS_BACKUP_KEY, JSON.stringify({
            notes: lightNotes,
            theme: state.theme,
            lang: state.lang,
            coolingDays: state.coolingDays
          }));
        } catch (e) {
          // Если картинки заняли много места, сохраняем в localStorage хотя бы чистый текст
          try {
            const textOnly = state.notes.map(n => ({ ...n, images: [] }));
            localStorage.setItem(LS_BACKUP_KEY, JSON.stringify({
              notes: textOnly,
              theme: state.theme,
              lang: state.lang,
              coolingDays: state.coolingDays
            }));
          } catch (e2) {}
        }

        updateStorageStatusUI();
      }

      // ==========================================
      // 5. ТЕМЫ И ЯЗЫКИ
      // ==========================================
      function applyTheme(themeName, persist = true) {
        if (!VALID_THEMES.includes(themeName)) return;
        state.theme = themeName;
        const root = document.documentElement;
        VALID_THEMES.forEach(th => root.classList.remove('theme-' + th));
        root.classList.add('theme-' + themeName);

        const isLight = themeName === 'light' || themeName === 'sepia';
        const metaScheme = document.getElementById('metaColorScheme');
        const metaBg = document.getElementById('metaThemeColor');
        if (metaScheme) metaScheme.setAttribute('content', isLight ? 'only light' : 'dark');
        if (metaBg) metaBg.setAttribute('content', THEME_META_BG[themeName] || '#0A0B0D');

        updateSettingsUI();
        if (persist) saveState();
      }

      function applyLang(langCode, persist = true) {
        if (!VALID_LANGS.includes(langCode)) return;
        const prevLang = state.lang;
        state.lang = langCode;

        // Если в базе только нетронутая стартовая инструкция — переводим её на новый язык
        const isOnlyStarters = state.notes.length === 1 &&
          state.notes[0].id === 'starter-1';
        if (isOnlyStarters && prevLang !== langCode) {
          const prevTpl = createStarterNotes(prevLang)[0];
          const cur = state.notes[0];
          if (prevTpl && prevTpl.title === cur.title && prevTpl.body === cur.body) {
            const nextTpl = createStarterNotes(langCode)[0];
            state.notes[0] = { ...cur, title: nextTpl.title, body: nextTpl.body };
          }
        }

        applyStaticTranslations();
        updateSettingsUI();
        renderAll(false);
        if (restModal.classList.contains('is-open')) renderRestList();
        if (searchModal.classList.contains('is-open')) renderSearchResults();
        if (persist) saveState();

      // ==========================================
      // 6. ТЕПЛОВАЯ ЛОГИКА ОСТЫВАНИЯ
      // ==========================================
      function createId() {
        return 'n_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
      }

      function getAgeDays(note) {
        const ref = typeof note.lastHeatedAt === 'number' ? note.lastHeatedAt : note.createdAt;
        return Math.max(0, (Date.now() - ref) / DAY_MS);
      }

      function isNoteArchived(note) {
        if (note.isPinned) return false;
        if (note.isRested) return true;
        return getAgeDays(note) >= state.coolingDays;
      }

      function getThermalState(note) {
        if (note.isPinned) return 'hot';
        if (isNoteArchived(note)) return 'archived';
        const age = getAgeDays(note);
        const hotLimit = state.coolingDays <= 4
          ? state.coolingDays * 0.25
          : Math.max(1, Math.round(state.coolingDays * 0.2));
        const coolingLimit = state.coolingDays <= 4
          ? state.coolingDays * 0.6
          : Math.max(hotLimit + 1, Math.round(state.coolingDays * 0.55));
        if (age <= hotLimit) return 'hot';
        if (age <= coolingLimit) return 'cooling';
        return 'cold';
      }

      function formatAge(note) {
        const days = Math.floor(getAgeDays(note));
        if (days < 1) return t('today');
        return t('daysAgo', { n: days });
      }

      function getPartitionedNotes() {
        const active = [];
        const rested = [];
        state.notes.forEach(note => {
          if (isNoteArchived(note)) rested.push(note);
          else active.push(note);
        });

        active.sort((a, b) => {
          if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
          return (b.lastHeatedAt || b.createdAt) - (a.lastHeatedAt || a.createdAt);
        });
        rested.sort((a, b) => (b.lastHeatedAt || b.createdAt) - (a.lastHeatedAt || a.createdAt));

        return { active, rested };
      }

      // ==========================================
      // 7. MARKDOWN, NOTEBOOKLM СНОСКИ И ЧЕКБОКСЫ
      // ==========================================
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function stripMarkdown(str) {
        return String(str || '')
          .replace(/```[\s\S]*?```/g, ' ')
          .replace(/`([^`]+)`/g, '$1')
          .replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1')
          .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
          .replace(/^\s*#{1,6}\s+/gm, '')
          .replace(/^\s*>\s?/gm, '')
          .replace(/^\s*[-*+]\s+\[[ xX]\]\s+/gm, '')
          .replace(/^\s*[-*+]\s+/gm, '')
          .replace(/^\s*\d+\.\s+/gm, '')
          .replace(/(\*\*|__|\*|_|~~)/g, '')
          .replace(/\[\d+(?:\s*,\s*\d+)*\]/g, '')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function deriveTitle(rawTitle, body) {
        const clean = (rawTitle || '').trim();
        if (clean) return clean;
        const lines = String(body || '').split('\n');
        for (const line of lines) {
          const stripped = stripMarkdown(line);
          if (stripped) {
            return stripped.length > 68 ? stripped.slice(0, 68).trim() + '…' : stripped;
          }
        }
        return t('untitled');
      }

      function getPreviewLine(note) {
        const lines = String(note.body || '').split('\n');
        const titleClean = stripMarkdown(note.title || '').toLowerCase();
        for (const line of lines) {
          const stripped = stripMarkdown(line);
          if (!stripped) continue;
          if (!note.title && stripped.toLowerCase() === deriveTitle('', note.body).toLowerCase()) continue;
          if (titleClean && stripped.toLowerCase() === titleClean) continue;
          return stripped.length > 76 ? stripped.slice(0, 76).trim() + '…' : stripped;
        }
        return '';
      }

      function getCheckboxStats(body) {
        const lines = String(body || '').split('\n');
        let total = 0;
        let done = 0;
        lines.forEach(line => {
          const m = line.match(/^\s*[-*+]\s+\[([ xX])\]\s+/);
          if (m) {
            total += 1;
            if (m[1].toLowerCase() === 'x') done += 1;
          }
        });
        return { total, done };
      }

      function formatInlineMarkdown(raw) {
        const codeTokens = [];
        let s = String(raw);

        // Защищаем inline code
        s = s.replace(/`([^`]+)`/g, (_, code) => {
          const idx = codeTokens.length;
          codeTokens.push('<code>' + escapeHtml(code) + '</code>');
          return '%%CODE_' + idx + '%%';
        });

        s = escapeHtml(s);

        // Markdown-ссылки [label](url)
        s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => {
          return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
        });

        // Сноски NotebookLM вида [1] или [1, 2, 5]
        s = s.replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, '<sup class="nlm-cite">[$1]</sup>');

        // Автоссылки https://... (не внутри уже созданного тега <a>)
        s = s.replace(/(^|[\s(>])(https?:\/\/[^\s<]+)/g, (match, prefix, url) => {
          const cleanUrl = url.replace(/[.,!?;:)\]]+$/, '');
          const trailing = url.slice(cleanUrl.length);
          return prefix + '<a href="' + cleanUrl + '" target="_blank" rel="noopener noreferrer">' + cleanUrl + '</a>' + trailing;
        });

        // Жирный, курсив, зачёркнутый
        s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
        s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
        s = s.replace(/(^|[^\*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');

        // Возвращаем inline code
        s = s.replace(/%%CODE_(\d+)%%/g, (_, idx) => codeTokens[Number(idx)] || '');
        return s;
      }

      function renderNoteBodyHtml(rawBody) {
        const lines = String(rawBody || '').replace(/\r\n/g, '\n').split('\n');
        const out = [];
        let inCode = false;
        let codeLines = [];
        let listType = null; // 'ul' | 'ol' | 'check'

        function closeList() {
          if (!listType) return;
          if (listType === 'ol') out.push('</ol>');
          else out.push('</ul>');
          listType = null;
        }

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];

          // Блоки кода ```
          if (line.trim().startsWith('```')) {
            closeList();
            if (!inCode) {
              inCode = true;
              codeLines = [];
            } else {
              out.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
              inCode = false;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          // Пустая строка
          if (!line.trim()) {
            closeList();
            continue;
          }

          // Разделитель ---
          if (/^\s*([-*_])\1{2,}\s*$/.test(line)) {
            closeList();
            out.push('<hr />');
            continue;
          }

          // Заголовки #..####
          const headingMatch = line.match(/^(#{1,4})\s+(.+)$/);
          if (headingMatch) {
            closeList();
            const level = headingMatch[1].length;
            out.push('<h' + level + '>' + formatInlineMarkdown(headingMatch[2].trim()) + '</h' + level + '>');
            continue;
          }

          // Цитата >
          const quoteMatch = line.match(/^\s*>\s?(.*)$/);
          if (quoteMatch) {
            closeList();
            out.push('<blockquote>' + formatInlineMarkdown(quoteMatch[1]) + '</blockquote>');
            continue;
          }

          // Интерактивный чекбокс - [ ] / - [x]
          const checkMatch = line.match(/^\s*[-*+]\s+\[([ xX])\]\s+(.*)$/);
          if (checkMatch) {
            if (listType !== 'check') {
              closeList();
              out.push('<ul class="md-checklist">');
              listType = 'check';
            }
            const checked = checkMatch[1].toLowerCase() === 'x';
            out.push(
              '<li class="md-check-item' + (checked ? ' is-checked' : '') + '" data-check-line="' + i + '" role="checkbox" aria-checked="' + checked + '">' +
                '<span class="md-check-box">' +
                  (checked ? '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>' : '') +
                '</span>' +
                '<span class="md-check-text">' + formatInlineMarkdown(checkMatch[2]) + '</span>' +
              '</li>'
            );
            continue;
          }

          // Маркированный список
          const ulMatch = line.match(/^\s*[-*+]\s+(.+)$/);
          if (ulMatch) {
            if (listType !== 'ul') {
              closeList();
              out.push('<ul>');
              listType = 'ul';
            }
            out.push('<li>' + formatInlineMarkdown(ulMatch[1]) + '</li>');
            continue;
          }

          // Нумерованный список
          const olMatch = line.match(/^\s*\d+\.\s+(.+)$/);
          if (olMatch) {
            if (listType !== 'ol') {
              closeList();
              out.push('<ol>');
              listType = 'ol';
            }
            out.push('<li>' + formatInlineMarkdown(olMatch[1]) + '</li>');
            continue;
          }

          // Обычный абзац
          closeList();
          out.push('<p>' + formatInlineMarkdown(line) + '</p>');
        }

        if (inCode) {
          out.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
        }
        closeList();

        return out.join('');
      }

      function toggleCheckboxInNote(noteId, lineIndex, checkItemEl) {
        const note = state.notes.find(n => n.id === noteId);
        if (!note) return;
        const lines = String(note.body || '').replace(/\r\n/g, '\n').split('\n');
        if (lineIndex < 0 || lineIndex >= lines.length) return;
        const line = lines[lineIndex];
        const m = line.match(/^(\s*[-*+]\s+\[)([ xX])(\]\s+.*)$/);
        if (!m) return;
        const isNowChecked = m[2].toLowerCase() !== 'x';
        const nextMark = isNowChecked ? 'x' : ' ';
        lines[lineIndex] = m[1] + nextMark + m[3];
        note.body = lines.join('\n');
        note.lastHeatedAt = Date.now();
        saveState();

        // Обновляем чекбокс на месте без перерисовки листа — скролл никогда не прыгает
        if (checkItemEl) {
          checkItemEl.classList.toggle('is-checked', isNowChecked);
          checkItemEl.setAttribute('aria-checked', String(isNowChecked));
          const box = checkItemEl.querySelector('.md-check-box');
          if (box) {
            box.innerHTML = isNowChecked
              ? '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>'
              : '';
          }
          const statusLabel = (note.isPinned ? t('statePinned') : t('stateHot')) + ' · ' + formatAge(note);
          readingPane.querySelectorAll('[data-status-label]').forEach(el => {
            el.textContent = statusLabel;
          });
          renderTimeline();
        } else {
          renderAll(false);
        }
      }

      // ==========================================
      // 8. СЖАТИЕ ИЗОБРАЖЕНИЙ И ПОМОЩНИКИ ФАЙЛОВ
      // ==========================================
      function sanitizeFilename(name) {
        return String(name || 'nerve')
          .replace(/[\\/:*?"<>|]+/g, '')
          .replace(/\s+/g, '_')
          .slice(0, 60) || 'nerve';
      }

      function compressImageFileToWebP(file) {
        return new Promise((resolve, reject) => {
          if (!file || !file.type.startsWith('image/')) {
            reject(new Error('Not an image'));
            return;
          }
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('Read error'));
          reader.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error('Decode error'));
            img.onload = () => {
              const maxSide = 1440;
              let w = img.naturalWidth || img.width;
              let h = img.naturalHeight || img.height;
              if (w > maxSide || h > maxSide) {
                const ratio = Math.min(maxSide / w, maxSide / h);
                w = Math.max(1, Math.round(w * ratio));
                h = Math.max(1, Math.round(h * ratio));
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);

              let out = '';
              try {
                out = canvas.toDataURL('image/webp', 0.82);
                if (!out.startsWith('data:image/webp')) {
                  out = canvas.toDataURL('image/jpeg', 0.84);
                }
              } catch (e) {
                out = canvas.toDataURL('image/jpeg', 0.84);
              }
              resolve(out);
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

      function triggerDownload(filename, content, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

            const selected = note.id === selectedNoteId;

            const preview = getPreviewLine(note);
            const ageLabel = formatAge(note);
            const checks = getCheckboxStats(note.body);
            const hasImg = note.images && note.images.length > 0;

            const metaBits = [];
            if (note.isPinned) {
              metaBits.push(
                '<span class="inline-flex items-center gap-1">' +
                  '<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +

                  '</svg>' +

              metaBits.push('<span class="tabular-nums">' + checks.done + '/' + checks.total + '</span>');

              metaBits.push('<span>' + note.images.length + ' ' + escapeHtml(t('addPhoto').toLowerCase()) + '</span>');
            }

            parts.push(
              '<button type="button" data-note-id="' + escapeHtml(note.id) + '" class="thread-node thermal-' + thermal + (selected ? ' is-selected' : '') + '">' +
                '<span class="node-dot"></span>' +

                '<div class="node-meta flex items-center gap-2.5 text-[11px] mt-1.5">' + metaBits.join('<span>·</span>') + '</div>' +

        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }

                : // Панель чтения: Править + Фокус (на ПК) + меню действий (···) с подписями
                  '<button type="button" data-action="focus" class="hidden sm:inline-flex header-ghost-btn text-[12.5px]" title="' + escapeHtml(t('tipFocus')) + '">' +
                    '<svg class="w-[15px] h-[15px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg>' +

              note.images.map((src, idx) =>

                    : ''

              ).join('') +

        // Контент: редактор или чистый Markdown
        let contentHtml = '';
        if (isEditMode) {

      function autoResizeTextarea(el) {
        el.style.height = 'auto';
        el.style.height = Math.max(320, el.scrollHeight + 24) + 'px';
      }

      function syncCurrentNoteEdits() {
        const note = state.notes.find(n => n.id === selectedNoteId);
        if (!note) return;
        const titleEl = document.getElementById('editTitleInput');
        const bodyEl = document.getElementById('editBodyInput');
        if (titleEl) note.title = titleEl.value;
        if (bodyEl) note.body = bodyEl.value;
        note.lastHeatedAt = Date.now();
        saveState();
        renderTimeline();
      }

      function renderAll(animateReading = true) {
        if (selectedNoteId && !state.notes.some(n => n.id === selectedNoteId)) {
          const { active } = getPartitionedNotes();
          selectedNoteId = active.length > 0 ? active[0].id : (state.notes[0] ? state.notes[0].id : null);
        }
        renderTimeline();
        renderReadingPane(animateReading);
      }

      // ==========================================
      // 11. ДЕЙСТВИЯ: ВОЗВРАТ, РЕДАКТОР, ФОКУС, ПОКОЙ
      // ==========================================
      function clearDeleteConfirm() {
        pendingDeleteNoteId = null;
        if (deleteConfirmTimer) {
          clearTimeout(deleteConfirmTimer);
          deleteConfirmTimer = null;
        }
      }

      function closeAllModals() {
        isNoteMenuOpen = false;
        newModal.classList.remove('is-open');
        searchModal.classList.remove('is-open');
        restModal.classList.remove('is-open');
        settingsModal.classList.remove('is-open');
        lightboxModal.classList.remove('is-open');
      }

      function closeNoteMenuDom() {
        if (!isNoteMenuOpen) return;
        isNoteMenuOpen = false;
        clearDeleteConfirm();
        const pop = document.getElementById('noteMenuPopover');
        if (pop) pop.classList.remove('is-open');
        const btn = readingPane.querySelector('[data-action="toggle-menu"]');
        if (btn) {
          btn.classList.remove('is-active');
          btn.setAttribute('aria-expanded', 'false');
        }
      }

      function selectNote(noteId, animate = true) {
        if (isEditMode) isEditMode = false;
        isNoteMenuOpen = false;
        clearDeleteConfirm();
        selectedNoteId = noteId;
        document.body.classList.add('mobile-reading-open');
        renderTimeline();
        renderReadingPane(animate);
      }

      function returnToHome() {
        if (isFocusMode) exitFocusMode();
        if (isEditMode) isEditMode = false;
        isNoteMenuOpen = false;
        closeAllModals();
        clearDeleteConfirm();
        selectedNoteId = null;
        document.body.classList.remove('mobile-reading-open');
        renderTimeline();
        renderReadingPane(false);
        timelineViewport.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function enterFocusMode() {
        if (!selectedNoteId) return;
        if (isEditMode) isEditMode = false;
        isNoteMenuOpen = false;
        isFocusMode = true;
        document.body.classList.add('focus-mode');
        renderReadingPane(false);
      }

      function exitFocusMode() {
        isFocusMode = false;
        stopFocusTimer();
        document.body.classList.remove('focus-mode');
        renderReadingPane(false);
      }

      function stopFocusTimer() {
        focusRunning = false;
        if (focusInterval) {
          clearInterval(focusInterval);
          focusInterval = null;
        }
      }

      function toggleFocusTimer() {
        if (focusRunning) {
          stopFocusTimer();
        } else {
          if (focusRemainingSec <= 0) focusRemainingSec = focusMinutes * 60;
          focusRunning = true;
          focusInterval = setInterval(() => {
            focusRemainingSec = Math.max(0, focusRemainingSec - 1);
            const disp = document.getElementById('focusTimerDisplay');
            if (disp) disp.textContent = formatTimerDisplay(focusRemainingSec);
            if (focusRemainingSec <= 0) {
              stopFocusTimer();
              showToast(t('focusDone'));
              renderReadingPane(false);
            }
          }, 1000);
        }
        renderReadingPane(false);
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('is-visible');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.remove('is-visible');
        }, 2400);
      }

      // ==========================================
      // 12. МОДАЛКИ: НОВАЯ МЫСЛЬ, ПОИСК, ПОКОЙ, НАСТРОЙКИ
      // ==========================================

        closeAllModals();
        newTitleInput.value = '';
        newBodyInput.value = '';

        renderNewImagesPreview();
        newModal.classList.add('is-open');
        setTimeout(() => newBodyInput.focus(), 40);

      function saveNewThought() {

      // ==========================================
      // 13. ИМПОРТ / ЭКСПОРТ (.MD И ПОЛНЫЙ .JSON)
      // ==========================================
      async function handleMdImportFiles(fileList) {
        const files = Array.from(fileList || []);
        if (files.length === 0) return;

        let importedCount = 0;
        const now = Date.now();

        for (const file of files) {
          try {
            const text = (await file.text()).replace(/^\uFEFF/, '').trim();
            if (!text) continue;

            // Проверяем, не экспорт ли это из Nerve (несколько заметок через ---\n\n# )
            const multiChunks = text.split(/\n{2,}={3,}\n{2,}/);
            if (multiChunks.length > 1) {
              multiChunks.forEach((chunk, idx) => {
                const trimmed = chunk.trim();
                if (!trimmed) return;
                const lines = trimmed.split('\n');
                let title = '';
                let body = trimmed;
                const h1 = lines[0].match(/^#\s+(.+)$/);
                if (h1) {
                  title = h1[1].trim();
                  body = lines.slice(1).join('\n').trim();
                }
                state.notes.unshift({
                  id: createId(),
                  title,
                  body,
                  createdAt: now - idx * 1000,
                  lastHeatedAt: now - idx * 1000,
                  isPinned: false,
                  isRested: false,
                  images: []
                });
                importedCount += 1;
              });
            } else {
              const lines = text.split('\n');
              let title = file.name.replace(/\.(md|markdown|txt)(\.txt)?$/i, '').trim();
              let body = text;
              const h1 = lines[0].match(/^#\s+(.+)$/);
              if (h1) {
                title = h1[1].trim();
                body = lines.slice(1).join('\n').trim();
              }
              state.notes.unshift({
                id: createId(),
                title,
                body,
                createdAt: now,
                lastHeatedAt: now,
                isPinned: false,
                isRested: false,
                images: []
              });
              importedCount += 1;
            }
          } catch (err) {
            // пропускаем битый файл
          }
        }

        if (importedCount > 0) {
          await saveState();
          selectedNoteId = state.notes[0].id;
          renderAll(true);
          closeAllModals();
          showToast(t('toastImportedMd', { n: importedCount }));
        } else {
          showToast(t('toastImportEmpty'));
        }
      }

      function exportMarkdownBase() {
        const chunks = state.notes.map(note => {
          const title = deriveTitle(note.title, note.body);
          return '# ' + title + '\n\n' + (note.body || '').trim();
        });
        const content = chunks.join('\n\n===\n\n') + '\n';
        const stamp = new Date().toISOString().slice(0, 10);
        triggerDownload(sanitizeFilename('nerve_' + stamp) + '.md', content, 'text/markdown;charset=utf-8');
        showToast(t('toastExportedMd'));
      }

      function exportJsonBackup() {
        const payload = {
          app: 'nerve',
          exportedAt: Date.now(),
          theme: state.theme,
          lang: state.lang,
          coolingDays: state.coolingDays,
          notes: state.notes
        };
        const stamp = new Date().toISOString().slice(0, 10);
        triggerDownload(
          sanitizeFilename('nerve_backup_' + stamp) + '.json',
          JSON.stringify(payload, null, 2),
          'application/json;charset=utf-8'
        );
        showToast(t('toastBackupSaved'));
      }

      async function handleJsonRestoreFile(file) {
        if (!file) return;
        try {
          const raw = await file.text();
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.notes)) {
            showToast(t('toastInvalidJson'));
            return;
          }
          const incoming = normalizeNotes(parsed.notes);
          const existingMap = new Map(state.notes.map(n => [n.id, n]));
          incoming.forEach(n => existingMap.set(n.id, n));
          state.notes = Array.from(existingMap.values());

          if (VALID_THEMES.includes(parsed.theme)) applyTheme(parsed.theme, false);
          const importedCooling = normalizeCoolingDays(parsed.coolingDays);
          if (importedCooling) state.coolingDays = importedCooling;
          if (VALID_LANGS.includes(parsed.lang)) applyLang(parsed.lang, false);

          await saveState();
          updateSettingsUI();
          const { active } = getPartitionedNotes();
          if (!selectedNoteId && active.length > 0) selectedNoteId = active[0].id;
          renderAll(true);
          closeAllModals();
          showToast(t('toastRestoredJson', { n: incoming.length }));
        } catch (err) {
          showToast(t('toastInvalidJson'));
        }
      }

      // ==========================================
      // 14. ПРИКРЕПЛЕНИЕ ФОТО (КНОПКА / CTRL+V / DROP)
      // ==========================================
      async function attachImagesToCurrentNote(files) {
        const note = state.notes.find(n => n.id === selectedNoteId);
        if (!note) return;
        let added = 0;
        for (const f of Array.from(files || [])) {
          if (!f.type || !f.type.startsWith('image/')) continue;
          try {
            const webp = await compressImageFileToWebP(f);
            note.images.push(webp);
            added += 1;
          } catch (e) {}
        }
        if (added > 0) {
          note.lastHeatedAt = Date.now();
          await saveState();
          renderAll(false);
          showToast(t('toastPhotoAdded'));
        } else {
          showToast(t('toastPhotoErr'));
        }
      }

      async function attachImagesToNewModal(files) {
        let added = 0;
        for (const f of Array.from(files || [])) {
          if (!f.type || !f.type.startsWith('image/')) continue;
          try {
            const webp = await compressImageFileToWebP(f);
            newModalImages.push(webp);
            added += 1;
          } catch (e) {}
        }
        if (added > 0) {
          renderNewImagesPreview();
          showToast(t('toastPhotoAdded'));
        } else {
          showToast(t('toastPhotoErr'));
        }
      }

      // Клик по узлам левой нити и узлу «Покой»
      nodesRow.addEventListener('click', (e) => {
        const restBtn = e.target.closest('#openRestNodeBtn');
        if (restBtn) {

          return;
        }
        const nodeBtn = e.target.closest('[data-note-id]');

        selectNote(nodeBtn.dataset.noteId, true);
      });

      // Клики внутри правого листа (действия, чекбоксы, фото, фокус)
      readingPane.addEventListener('click', (e) => {
        // Лайтбокс изображения
        const imgEl = e.target.closest('[data-lightbox-src]');
        if (imgEl && !e.target.closest('[data-remove-img]')) {
          lightboxImg.src = imgEl.getAttribute('src');
          lightboxModal.classList.add('is-open');
          return;
        }

        // Удаление фото в редакторе
        const remImgBtn = e.target.closest('[data-remove-img]');
        if (remImgBtn) {
          const note = state.notes.find(n => n.id === selectedNoteId);
          const idx = Number(remImgBtn.dataset.removeImg);
          if (note && Number.isInteger(idx)) {
            note.images.splice(idx, 1);
            saveState();
            renderAll(false);
          }
          return;
        }

        // Интерактивный чекбокс (не перехватываем клик по ссылке внутри строки)
        const checkItem = e.target.closest('[data-check-line]');
        if (checkItem && !e.target.closest('a')) {
          const lineIdx = Number(checkItem.dataset.checkLine);
          toggleCheckboxInNote(selectedNoteId, lineIdx, checkItem);
          return;
        }

        // Кнопки панели Фокуса
        const focusMinBtn = e.target.closest('[data-focus-min]');
        if (focusMinBtn) {
          stopFocusTimer();
          focusMinutes = Number(focusMinBtn.dataset.focusMin);
          focusRemainingSec = focusMinutes * 60;
          renderReadingPane(false);
          return;
        }

        const focusActBtn = e.target.closest('[data-focus-action]');
        if (focusActBtn) {
          const act = focusActBtn.dataset.focusAction;
          if (act === 'toggle') toggleFocusTimer();
          else if (act === 'reset') {
            stopFocusTimer();
            focusRemainingSec = focusMinutes * 60;
            renderReadingPane(false);
          } else if (act === 'exit') {
            exitFocusMode();
          }
          return;
        }

        // Основные кнопки панели заметки
        const actBtn = e.target.closest('[data-action]');
        if (!actBtn) return;
        const action = actBtn.dataset.action;
        const note = state.notes.find(n => n.id === selectedNoteId);

        if (action === 'mobile-back') {
          if (isEditMode) isEditMode = false;
          isNoteMenuOpen = false;
          document.body.classList.remove('mobile-reading-open');
          return;
        }
        if (!note) return;

        if (action === 'toggle-menu') {
          isNoteMenuOpen = !isNoteMenuOpen;
          if (!isNoteMenuOpen) clearDeleteConfirm();
          const pop = document.getElementById('noteMenuPopover');
          if (pop) {
            pop.classList.toggle('is-open', isNoteMenuOpen);
            actBtn.classList.toggle('is-active', isNoteMenuOpen);
            actBtn.setAttribute('aria-expanded', isNoteMenuOpen ? 'true' : 'false');
          } else {
            renderReadingPane(false);
          }
          return;
        }

        if (action === 'toggle-pin') {
          isNoteMenuOpen = false;
          note.isPinned = !note.isPinned;
          if (note.isPinned) {
            note.isRested = false;
            note.lastHeatedAt = Date.now();
          }
          saveState();
          renderAll(false);
          showToast(t(note.isPinned ? 'toastPinned' : 'toastUnpinned'));
        } else if (action === 'heat') {
          isNoteMenuOpen = false;
          note.isRested = false;
          note.lastHeatedAt = Date.now();
          saveState();
          renderAll(false);
          showToast(t('toastHeated'));
        } else if (action === 'add-photo') {
          isNoteMenuOpen = false;
          closeNoteMenuDom();
          noteImageInput.value = '';
          noteImageInput.click();
        } else if (action === 'start-edit') {
          isNoteMenuOpen = false;
          clearDeleteConfirm();
          isEditMode = true;
          renderReadingPane(false);
        } else if (action === 'finish-edit') {
          isEditMode = false;
          saveState();
          renderAll(false);
        } else if (action === 'edit-add-check') {
          const bodyEl = document.getElementById('editBodyInput');
          if (bodyEl) {
            const prefix = bodyEl.value && !bodyEl.value.endsWith('\n') ? '\n' : '';
            bodyEl.value += prefix + '- [ ] ';
            bodyEl.focus();
            autoResizeTextarea(bodyEl);
            syncCurrentNoteEdits();
          }
        } else if (action === 'focus') {
          enterFocusMode();
        } else if (action === 'toggle-rest') {
          isNoteMenuOpen = false;
          const archived = isNoteArchived(note);
          if (archived) {
            note.isRested = false;
            note.lastHeatedAt = Date.now();
            showToast(t('toastWoke'));
          } else {
            note.isPinned = false;
            note.isRested = true;
            showToast(t('toastRested'));
            const { active } = getPartitionedNotes();
            selectedNoteId = active.length > 0 ? active[0].id : null;
            if (!selectedNoteId) document.body.classList.remove('mobile-reading-open');
          }
          saveState();
          renderAll(true);
        } else if (action === 'delete') {
          if (pendingDeleteNoteId === note.id) {
            isNoteMenuOpen = false;
            clearDeleteConfirm();
            state.notes = state.notes.filter(n => n.id !== note.id);
            const { active } = getPartitionedNotes();
            selectedNoteId = active.length > 0 ? active[0].id : null;
            if (!selectedNoteId) document.body.classList.remove('mobile-reading-open');
            saveState();
            renderAll(true);
            showToast(t('toastDeleted'));
          } else {
            pendingDeleteNoteId = note.id;
            isNoteMenuOpen = true;
            renderReadingPane(false);
            deleteConfirmTimer = setTimeout(() => {
              pendingDeleteNoteId = null;
              renderReadingPane(false);
            }, 3500);
          }
        }
      });

      lightboxModal.addEventListener('click', (e) => { if (e.target === lightboxModal) closeAllModals(); });

      // Вставка фото через Ctrl+V
      document.addEventListener('paste', (e) => {
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        const imgFiles = [];
        for (const item of items) {
          if (item.type && item.type.startsWith('image/')) {
            const f = item.getAsFile();
            if (f) imgFiles.push(f);
          }
        }
        if (imgFiles.length === 0) return;
        e.preventDefault();
        if (newModal.classList.contains('is-open')) {
          attachImagesToNewModal(imgFiles);
        } else if (selectedNoteId) {
          attachImagesToCurrentNote(imgFiles);
        }
      });

      [readingPane, newModalCard].forEach(zone => {
        zone.addEventListener('dragover', (e) => {
          e.preventDefault();
          zone.classList.add('drop-active');
        });
        zone.addEventListener('dragleave', () => zone.classList.remove('drop-active'));
        zone.addEventListener('drop', (e) => {
          e.preventDefault();
          zone.classList.remove('drop-active');
          const files = e.dataTransfer && e.dataTransfer.files;
          if (!files || files.length === 0) return;
          if (zone === newModalCard) attachImagesToNewModal(files);
          else if (selectedNoteId) attachImagesToCurrentNote(files);
        });
      });

      // Горячие клавиши на ПК
      document.addEventListener('keydown', (e) => {
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        const isTyping = tag === 'input' || tag === 'textarea';

        // Ctrl/Cmd + Enter сохраняет новую мысль или завершает редактирование
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          if (newModal.classList.contains('is-open')) {
            e.preventDefault();
            saveNewThought();
            return;
          }
          if (isEditMode) {
            e.preventDefault();
            isEditMode = false;
            saveState();
            renderAll(false);
            return;
          }
        }

        if (e.key === 'Escape') {
          if (isNoteMenuOpen) {
            closeNoteMenuDom();
            return;
          }
          if (lightboxModal.classList.contains('is-open') ||
              newModal.classList.contains('is-open') ||
              searchModal.classList.contains('is-open') ||
              restModal.classList.contains('is-open') ||
              settingsModal.classList.contains('is-open')) {
            closeAllModals();
            return;
          }
          if (isFocusMode) {
            exitFocusMode();
            return;
          }
          if (isEditMode) {
            isEditMode = false;
            saveState();
            renderAll(false);
            return;
          }
          return;
        }

        if (isTyping || e.ctrlKey || e.metaKey || e.altKey) return;

        const hasOpenModal =
          lightboxModal.classList.contains('is-open') ||
          newModal.classList.contains('is-open') ||
          searchModal.classList.contains('is-open') ||
          restModal.classList.contains('is-open') ||
          settingsModal.classList.contains('is-open');
        if (hasOpenModal) return;

        const key = (e.key || '').toLowerCase();
        const code = e.code || '';

        if (code === 'KeyN' || key === 'n') {
          e.preventDefault();
          openNewModal();
        } else if (e.key === '/' || (code === 'Slash' && !e.shiftKey)) {
          e.preventDefault();
          openSearchModal();
        } else if ((code === 'KeyE' || key === 'e') && selectedNoteId && !isFocusMode) {
          e.preventDefault();
          isEditMode = !isEditMode;
          renderReadingPane(false);
        } else if ((code === 'KeyF' || key === 'f') && selectedNoteId) {
          e.preventDefault();
          if (isFocusMode) exitFocusMode();
          else enterFocusMode();
        }
      });

      // ==========================================
      // 16. ЗАПУСК ПРИЛОЖЕНИЯ
      // ==========================================
      async function init() {
        await loadState();
        applyStaticTranslations();
        const { active } = getPartitionedNotes();
        if (window.innerWidth >= 768) {
          selectedNoteId = active.length > 0 ? active[0].id : (state.notes[0] ? state.notes[0].id : null);
        } else {
          selectedNoteId = null;
        }
        renderAll(false);
      }

      init();
    })();
  </script>
</body>
